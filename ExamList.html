<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam List | QC Team</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-[#F8FAFC] text-slate-900 font-sans">

    <div class="flex flex-col md:flex-row min-h-screen">
        <div id="sidebar-container" class="md:h-screen sticky top-0 z-50"></div>

        <main class="flex-1 p-4 md:p-8 overflow-y-auto">
            <header class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-100 pb-5">
                <div>
                    <h1 class="text-3xl md:text-4xl font-black flex items-center gap-3 tracking-tight">
                        <i data-lucide="book-open-text" class="text-blue-600"></i> Personnel Competency Exams
                    </h1>
                    <p class="text-slate-500 font-bold text-sm mt-1">Complete your mandatory certification tests and track multi-level validation logs.</p>
                </div>
                <div class="text-sm font-black text-blue-700 bg-blue-50 border border-blue-100 px-4 py-2.5 rounded-2xl flex items-center gap-2 self-start md:self-center shadow-sm">
                    <i data-lucide="award" size="16" class="text-blue-600"></i> Quality Assurance Academy
                </div>
            </header>
            
            <div id="loading" class="flex flex-col justify-center items-center h-64 space-y-2">
                <i data-lucide="loader-2" class="animate-spin text-blue-600" size="40"></i>
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Fetching Competency Registry...</p>
            </div>
            
            <div id="examGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </main>
    </div>

    <script type="module">
        import { db } from './js/FirebaseConfig.js';
        import { collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        import { ROLES, RoleManager, detectUserRole } from './js/Roles.js';
        import { loadSidebar } from './js/sidebar-loader.js';

        async function initApp() {
            const currentUserId = sessionStorage.getItem('qc_logged_in_user');
            if (!currentUserId) RoleManager.forceLogout();

            const currentRole = detectUserRole(currentUserId);
            if (!currentRole) RoleManager.forceLogout();

            const sessionData = localStorage.getItem('session');
            if (!sessionData) RoleManager.forceLogout();

            const sidebarFile = currentRole === ROLES.QC_LEADER ? 'SidebarLeader.html' : 'SidebarOperator.html';
            await loadSidebar(sidebarFile);
            
            // AKTIFKAN FIX: Pasang kawalan pemicu menu sisi untuk peranti mobile
            setupSidebarToggle();

            initExams();
        }

        // Fungsi Global Event Delegation untuk kawalan buka/tutup menu sisi pada Mobile
        function setupSidebarToggle() {
            document.addEventListener('click', (e) => {
                const toggleBtn = e.target.closest('#mobileMenuBtn');
                const closeBtn = e.target.closest('#closeMenuBtn');
                const overlay = e.target.closest('#mobileOverlay');

                const sidebarMenu = document.getElementById('sidebarMenu');
                const mobileOverlay = document.getElementById('mobileOverlay');

                if (!sidebarMenu) return;

                // Membuka Drawer Menu Sisi
                if (toggleBtn) {
                    sidebarMenu.classList.remove('-translate-x-full');
                    if (mobileOverlay) mobileOverlay.classList.remove('hidden');
                    document.body.style.overflow = 'hidden'; 
                }

                // Menutup Drawer Menu Sisi
                if (closeBtn || overlay) {
                    sidebarMenu.classList.add('-translate-x-full');
                    if (mobileOverlay) mobileOverlay.classList.add('hidden');
                    document.body.style.overflow = ''; 
                }
            });
        }

        async function initExams() {
            const grid = document.getElementById('examGrid');
            const loader = document.getElementById('loading');
            const user = JSON.parse(localStorage.getItem('session'));

            try {
                // 1. Ambil semua exam yang berstatus aktif
                const examsSnap = await getDocs(query(collection(db, "qc_exams"), where("status", "==", "active")));
                
                // 2. Ambil semua rekod submission kepunyaan user semasa
                const subsSnap = await getDocs(query(collection(db, "exam_submissions"), where("operatorName", "==", user.name)));
                
                const submissions = subsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                loader.classList.add('hidden');

                let sortedExams = [];

                examsSnap.forEach(doc => {
                    const exam = doc.data();
                    const userSub = submissions.find(
                        s => String(s.examId).trim() === String(doc.id).trim()
                    );

                    let overallStatus = "Not Started";
                    let sortWeight = 1;

                    // Logik Pengiraan Kelulusan Enterprise Multi-Level (Leader + Executive)
                    if (userSub) {
                        const leaderApp = userSub.leaderApproval || {};
                        const execApp = userSub.executiveApproval || userSub.exectutiveApproval || {};

                        const isLeaderApproved = leaderApp.status === 'Approved';
                        const isExecApproved = execApp.status === 'Approved';
                        const isAnyRejected = leaderApp.status === 'Rejected' || execApp.status === 'Rejected';

                        if (isLeaderApproved && isExecApproved) {
                            overallStatus = "Approved";
                            sortWeight = 3; // Letak di bawah kerana selesai
                        } else if (isAnyRejected) {
                            overallStatus = "Rejected";
                            sortWeight = 1; // Prioriti tinggi untuk retake
                        } else {
                            overallStatus = "Pending";
                            sortWeight = 2; // Sedang disemak
                        }
                    }

                    sortedExams.push({
                        id: doc.id,
                        data: exam,
                        submission: userSub,
                        overallStatus,
                        sortWeight,
                        createdAtMillis: exam.createdAt ? exam.createdAt.toMillis() : 0
                    });
                });

                // Isih urutan kad: Utamakan tindakan kritikal (Not Started/Rejected), kemudian Pending & Approved
                sortedExams.sort((a, b) => {
                    if (a.sortWeight !== b.sortWeight) return a.sortWeight - b.sortWeight;
                    return b.createdAtMillis - a.createdAtMillis;
                });

                if (sortedExams.length === 0) {
                    grid.innerHTML = renderEmptyState();
                    lucide.createIcons();
                    return;
                }

                grid.innerHTML = "";
                sortedExams.forEach(item => {
                    grid.innerHTML += renderExamCard(item);
                });

                lucide.createIcons();
            } catch (error) { 
                console.error("Error Loading Exams Database:", error); 
                grid.innerHTML = `<p class="col-span-full text-center text-red-500 font-bold p-12">Failed to load examination board items.</p>`;
            }
        }

        function renderEmptyState() {
            return `
                <div class="col-span-full">
                    <div class="bg-white border border-slate-200 rounded-[28px] p-16 text-center shadow-sm">
                        <div class="flex justify-center mb-5">
                            <div class="w-12 h-12 rounded-full bg-green-100 flex items-center justify-center">
                                <i data-lucide="badge-check" class="text-green-600"></i>
                            </div>
                        </div>
                        <h2 class="text-3xl font-black text-slate-900 mb-3">You're All Caught Up!</h2>
                        <p class="text-slate-500 text-lg">There are currently no active exams assigned to your profile.</p>
                    </div>
                </div>`;
        }

        function renderExamCard({ id, data: exam, submission: userSub, overallStatus }) {
            const creator = exam.createdBy || {};
            const date = exam.createdAt ? exam.createdAt.toDate().toLocaleDateString() : 'N/A';

            let btnHTML = "";
            let statusBadge = "";
            let approvalProgressHTML = "";
            let rejectionFeedbackHTML = "";

            // 1. BLOK STRUKTUR STATUS JIKA BELUM AMBIL EXAM
            if (overallStatus === 'Not Started') {
                statusBadge = `<span class="bg-slate-100 text-slate-600 border border-slate-200 px-2.5 py-1 rounded-xl text-xs font-black uppercase tracking-wide">Not Started</span>`;
                btnHTML = `
                    <button onclick="window.location.href='TakeExam.html?id=${id}'" 
                        class="w-full py-3 bg-blue-600 text-white font-black rounded-xl hover:bg-blue-700 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-sm">
                        <i data-lucide="play" size="16"></i> Start Assessment
                    </button>`;
            } else {
                // 2. BLOK STRUKTUR STATUS JIKA DAH SUBMIT (PENDING, APPROVED, REJECTED)
                const leaderApp = userSub.leaderApproval || {};
                const execApp = userSub.executiveApproval || userSub.exectutiveApproval || {};

                let badgeClass = "bg-amber-50 text-amber-700 border-amber-200";
                if (overallStatus === "Approved") badgeClass = "bg-green-100 text-green-800 border-green-300";
                if (overallStatus === "Rejected") badgeClass = "bg-red-100 text-red-800 border-red-300";

                statusBadge = `<span class="px-2.5 py-1 rounded-xl border ${badgeClass} text-xs font-black tracking-wide uppercase">${overallStatus}</span>`;

                // Sub-Section: Jejak kelulusan multi-level secara real-time
                approvalProgressHTML = `
                    <div class="mt-4 pt-3 border-t border-dashed border-slate-100 space-y-2">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-wider">Validation Progress</p>
                        <div class="flex items-center justify-between text-xs font-medium">
                            <span class="text-slate-500 flex items-center gap-1">
                                <i data-lucide="shield-check" size="14" class="text-slate-400"></i> QC Leader:
                            </span>
                            <span class="font-black ${leaderApp.status === 'Approved' ? 'text-green-600' : (leaderApp.status === 'Rejected' ? 'text-red-600' : 'text-amber-500')}">
                                ${leaderApp.status || 'Pending'}
                            </span>
                        </div>
                        <div class="flex items-center justify-between text-xs font-medium">
                            <span class="text-slate-500 flex items-center gap-1">
                                <i data-lucide="user-check" size="14" class="text-slate-400"></i> Executive:
                            </span>
                            <span class="font-black ${execApp.status === 'Approved' ? 'text-green-600' : (execApp.status === 'Rejected' ? 'text-red-600' : 'text-amber-500')}">
                                ${execApp.status || 'Pending'}
                            </span>
                        </div>
                    </div>`;

                // Logik Penentuan Bentuk Butang Tindakan Utama Dinamik
                if (overallStatus === 'Pending') {
                    btnHTML = `
                        <div class="w-full py-3 bg-slate-50 text-slate-400 font-black rounded-xl border border-slate-200/60 text-center text-xs flex items-center justify-center gap-2 select-none">
                            <i data-lucide="lock" size="14" class="text-slate-400"></i> Locked — Under Review
                        </div>`;
                } else if (overallStatus === 'Approved') {
                    btnHTML = `
                        <div class="w-full py-3 bg-green-50 text-green-700 font-black rounded-xl border border-green-200 text-center text-xs flex items-center justify-center gap-2 select-none">
                            <i data-lucide="check-circle" size="14"></i> Certified & Approved
                        </div>`;
                } else if (overallStatus === 'Rejected') {
                    // Benarkan operator menduduki semula peperiksaan (Retake) jika ditolak
                    btnHTML = `
                        <button onclick="window.location.href='TakeExam.html?id=${id}'" 
                            class="w-full py-3 bg-red-600 text-white font-black rounded-xl hover:bg-red-700 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-sm">
                            <i data-lucide="alert-triangle" size="14"></i> Retake Exam
                        </button>`;

                    // Ekstrak maklum balas/alasan penolakan jika wujud dalam sistem database
                    let feedbackList = [];
                    if (leaderApp.status === 'Rejected' && leaderApp.reason) {
                        feedbackList.push(`<strong>Leader:</strong> "${leaderApp.reason}"`);
                    }
                    if (execApp.status === 'Rejected' && execApp.reason) {
                        feedbackList.push(`<strong>Executive:</strong> "${execApp.reason}"`);
                    }

                    if (feedbackList.length > 0) {
                        rejectionFeedbackHTML = `
                            <div class="mt-3 p-3 bg-red-50/80 border border-red-100 rounded-xl text-[11px] text-red-700 space-y-1">
                                <p class="font-black uppercase tracking-wider text-[9px] text-red-500 flex items-center gap-1">
                                    <i data-lucide="message-square" size="10"></i> Rejection Feedback:
                                </p>
                                ${feedbackList.map(f => `<p class="leading-relaxed font-medium">${f}</p>`).join('')}
                            </div>`;
                    }
                }
            }

            // Kerangka Induk Paparan Kad Maklumat Kompetensi Khas
            const authorInfo = `
                <div class="mt-4 p-3 bg-slate-50 border border-slate-100 rounded-xl text-[11px] text-slate-500 font-medium space-y-1">
                    <p class="flex items-center gap-1.5"><i data-lucide="user" size="12" class="text-slate-400"></i> Assigned by: ${creator.name || 'Admin'}</p>
                    <p class="flex items-center gap-1.5"><i data-lucide="briefcase" size="12" class="text-slate-400"></i> Dept: ${creator.department || 'Quality Control'}</p>
                    <p class="flex items-center gap-1.5"><i data-lucide="calendar" size="12" class="text-slate-400"></i> Posted: ${date}</p>
                </div>`;

            return `
                <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <h4 class="font-black text-lg leading-snug text-slate-800">${exam.title}</h4>
                            ${statusBadge}
                        </div>
                        <p class="text-xs font-black text-slate-400 flex items-center gap-1 mb-2">
                            <i data-lucide="clock" size="12"></i> Time Limit: ${exam.timeLimitMinutes || 0} Mins
                        </p>
                        
                        ${authorInfo}
                        ${approvalProgressHTML}
                        ${rejectionFeedbackHTML}
                    </div>
                    <div class="mt-6">${btnHTML}</div>
                </div>`;
        }

        initApp();
    </script>
</body>

</html>
