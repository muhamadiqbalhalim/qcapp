<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam List | QC Team</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-[#F8FAFC] text-slate-900 font-sans">

    <div class="flex flex-col md:flex-row min-h-screen">
        <div id="sidebar-container" class="md:h-screen sticky top-0 z-50"></div>

        <main class="flex-1 p-4 md:p-8 overflow-y-auto">
            <header class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-200 pb-6">
                <div>
                    <h1 class="text-3xl md:text-4xl font-black flex items-center gap-3 tracking-tight text-slate-800">
                        <i data-lucide="book-open-text" class="text-blue-600" size="36"></i> Personnel Competency Exams
                    </h1>
                    <p class="text-slate-500 font-semibold text-sm mt-2">Complete your mandatory certification tests and track multi-level validation logs.</p>
                </div>
                <div class="text-sm font-black text-blue-700 bg-blue-50 border border-blue-100 px-4 py-3 rounded-2xl flex items-center gap-2 self-start md:self-center shadow-sm">
                    <i data-lucide="award" size="18" class="text-blue-600"></i> Quality Assurance Academy
                </div>
            </header>
            
            <div id="loading" class="flex flex-col justify-center items-center h-64 space-y-3">
                <i data-lucide="loader-2" class="animate-spin text-blue-600" size="44"></i>
                <p class="text-[11px] font-black text-slate-400 uppercase tracking-widest">Fetching Competency Registry...</p>
            </div>
            
            <div id="examGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>
        </main>
    </div>

    <script type="module">
        import { db } from './js/FirebaseConfig.js';
        import { collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        import { ROLES, RoleManager, detectUserRole } from './js/Roles.js';
        import { loadSidebar } from './js/sidebar-loader.js';

        async function initApp() {
            const currentUserId = sessionStorage.getItem('qc_logged_in_user');
            if (!currentUserId) RoleManager.forceLogout();

            const currentRole = detectUserRole(currentUserId);
            if (!currentRole) RoleManager.forceLogout();

            const sessionData = localStorage.getItem('session');
            if (!sessionData) RoleManager.forceLogout();

            const sidebarFile = currentRole === ROLES.QC_LEADER ? 'SidebarLeader.html' : 'SidebarOperator.html';
            await loadSidebar(sidebarFile);
            
            setupSidebarToggle();
            initExams();
        }

        function setupSidebarToggle() {
            document.addEventListener('click', (e) => {
                const toggleBtn = e.target.closest('#mobileMenuBtn');
                const closeBtn = e.target.closest('#closeMenuBtn');
                const overlay = e.target.closest('#mobileOverlay');

                const sidebarMenu = document.getElementById('sidebarMenu');
                const mobileOverlay = document.getElementById('mobileOverlay');

                if (!sidebarMenu) return;

                if (toggleBtn) {
                    sidebarMenu.classList.remove('-translate-x-full');
                    if (mobileOverlay) mobileOverlay.classList.remove('hidden');
                    document.body.style.overflow = 'hidden'; 
                }

                if (closeBtn || overlay) {
                    sidebarMenu.classList.add('-translate-x-full');
                    if (mobileOverlay) mobileOverlay.classList.add('hidden');
                    document.body.style.overflow = ''; 
                }
            });
        }

        async function initExams() {
            const grid = document.getElementById('examGrid');
            const loader = document.getElementById('loading');
            const user = JSON.parse(localStorage.getItem('session'));

            try {
                const examsSnap = await getDocs(query(collection(db, "qc_exams_templates"), where("status", "==", "active")));
                const subsSnap = await getDocs(query(collection(db, "qc_exam_submissions"), where("operatorName", "==", user.name)));
                
                const submissions = subsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                loader.classList.add('hidden');

                let sortedExams = [];

                examsSnap.forEach(doc => {
                    const exam = doc.data();
                    const userSub = submissions.find(
                        s => String(s.examId).trim() === String(doc.id).trim()
                    );

                    let overallStatus = "Not Started";
                    let sortWeight = 1;

                    if (userSub) {
                        const leaderApp = userSub.leaderApproval || {};
                        const execApp = userSub.executiveApproval || userSub.exectutiveApproval || {};

                        const isLeaderApproved = leaderApp.status === 'Approved';
                        const isExecApproved = execApp.status === 'Approved';
                        const isAnyRejected = leaderApp.status === 'Rejected' || execApp.status === 'Rejected';

                        if (isLeaderApproved && isExecApproved) {
                            overallStatus = "Approved";
                            sortWeight = 3; 
                        } else if (isAnyRejected) {
                            overallStatus = "Rejected";
                            sortWeight = 1; 
                        } else {
                            overallStatus = "Pending";
                            sortWeight = 2; 
                        }
                    }

                    sortedExams.push({
                        id: doc.id,
                        data: exam,
                        submission: userSub,
                        overallStatus,
                        sortWeight,
                        createdAtMillis: exam.createdAt ? exam.createdAt.toMillis() : 0
                    });
                });

                sortedExams.sort((a, b) => {
                    if (a.sortWeight !== b.sortWeight) return a.sortWeight - b.sortWeight;
                    return b.createdAtMillis - a.createdAtMillis;
                });

                if (sortedExams.length === 0) {
                    grid.innerHTML = renderEmptyState();
                    lucide.createIcons();
                    return;
                }

                grid.innerHTML = "";
                sortedExams.forEach(item => {
                    grid.innerHTML += renderExamCard(item);
                });

                lucide.createIcons();
            } catch (error) { 
                console.error("Error Loading Exams Database:", error); 
                grid.innerHTML = `<p class="col-span-full text-center text-red-500 font-bold p-12">Failed to load examination board items.</p>`;
            }
        }

        function renderEmptyState() {
            return `
                <div class="col-span-full">
                    <div class="bg-white border border-slate-200 rounded-[28px] p-16 text-center shadow-sm">
                        <div class="flex justify-center mb-5">
                            <div class="w-16 h-16 rounded-full bg-green-100 flex items-center justify-center">
                                <i data-lucide="badge-check" size="32" class="text-green-600"></i>
                            </div>
                        </div>
                        <h2 class="text-3xl font-black text-slate-900 mb-3">You're All Caught Up!</h2>
                        <p class="text-slate-500 text-lg">There are currently no active exams assigned to your profile.</p>
                    </div>
                </div>`;
        }

        function renderExamCard({ id, data: exam, submission: userSub, overallStatus }) {
            // --- START: CREATOR DETAILS & TIMESTAMP ---
            const creator = exam.createdBy || {};
            const creatorId = creator.id || creator.employeeId || creator.departmentId || '-';
            
            let dateStr = 'N/A';
            let timeStr = 'N/A';
            if (exam.createdAt) {
                const dateObj = exam.createdAt.toDate();
                dateStr = dateObj.toLocaleDateString();
                timeStr = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
            }
            // --- END: CREATOR DETAILS & TIMESTAMP ---

            let btnHTML = "";
            let statusBadge = "";
            let approvalProgressHTML = "";
            let rejectionFeedbackHTML = "";
            let submittedToHTML = ""; 

            if (overallStatus === 'Not Started') {
                statusBadge = `<span class="bg-slate-100 text-slate-600 border border-slate-200 px-3 py-1.5 rounded-lg text-xs font-black uppercase tracking-wider shrink-0 shadow-sm">Not Started</span>`;
                btnHTML = `
                    <button onclick="window.location.href='TakeExam.html?id=${id}'" 
                        class="w-full py-3.5 bg-blue-600 text-white font-black rounded-xl hover:bg-blue-700 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-sm">
                        <i data-lucide="play" size="16"></i> Start Assessment
                    </button>`;
            } else {
                const leaderApp = userSub.leaderApproval || {};
                const execApp = userSub.executiveApproval || userSub.exectutiveApproval || {};

                const lId = userSub.leaderDepartmentId || leaderApp.departmentId || "-";
                const lName = userSub.leaderName || leaderApp.approverName || "Pending Setup";
                const eId = userSub.executiveDepartmentId || execApp.departmentId || "-";
                const eName = userSub.executiveName || execApp.approverName || "Pending Setup";

                submittedToHTML = `
                    <div class="mt-4 p-4 bg-blue-50/60 border border-blue-100 rounded-2xl text-[11px] shadow-sm">
                        <p class="font-black uppercase tracking-wider text-[10px] text-blue-600 flex items-center gap-1.5 border-b border-blue-100/80 pb-1.5 mb-2.5">
                            <i data-lucide="send" size="12"></i> Submitted To
                        </p>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="space-y-0.5 min-w-0">
                                <p class="text-slate-500 font-medium">Id Leader: <span class="font-bold text-slate-800 block truncate" title="${lId}">${lId}</span></p>
                                <p class="text-slate-500 font-medium">Name Leader: <span class="font-bold text-slate-800 block truncate" title="${lName}">${lName}</span></p>
                            </div>
                            <div class="space-y-0.5 min-w-0">
                                <p class="text-slate-500 font-medium">Id Exec: <span class="font-bold text-slate-800 block truncate" title="${eId}">${eId}</span></p>
                                <p class="text-slate-500 font-medium">Name Exec: <span class="font-bold text-slate-800 block truncate" title="${eName}">${eName}</span></p>
                            </div>
                        </div>
                    </div>`;

                let badgeClass = "bg-amber-50 text-amber-700 border-amber-200";
                if (overallStatus === "Approved") badgeClass = "bg-green-100 text-green-800 border-green-300";
                if (overallStatus === "Rejected") badgeClass = "bg-red-100 text-red-800 border-red-300";

                statusBadge = `<span class="px-3 py-1.5 rounded-lg border ${badgeClass} text-xs font-black tracking-wider uppercase shrink-0 shadow-sm">${overallStatus}</span>`;

                approvalProgressHTML = `
                    <div class="mt-5 space-y-3">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-dashed border-slate-200 pb-2">Validation Progress</p>
                        <div class="flex items-center justify-between text-xs">
                            <span class="text-slate-500 font-bold flex items-center gap-1.5">
                                <i data-lucide="shield-check" size="14" class="text-slate-400"></i> QC Leader
                            </span>
                            <span class="font-black px-2.5 py-1 rounded-md ${leaderApp.status === 'Approved' ? 'bg-green-50 text-green-600' : (leaderApp.status === 'Rejected' ? 'bg-red-50 text-red-600' : 'bg-amber-50 text-amber-600')}">
                                ${leaderApp.status || 'Pending'}
                            </span>
                        </div>
                        <div class="flex items-center justify-between text-xs">
                            <span class="text-slate-500 font-bold flex items-center gap-1.5">
                                <i data-lucide="user-check" size="14" class="text-slate-400"></i> Executive
                            </span>
                            <span class="font-black px-2.5 py-1 rounded-md ${execApp.status === 'Approved' ? 'bg-green-50 text-green-600' : (execApp.status === 'Rejected' ? 'bg-red-50 text-red-600' : 'bg-amber-50 text-amber-600')}">
                                ${execApp.status || 'Pending'}
                            </span>
                        </div>
                    </div>`;

                if (overallStatus === 'Pending') {
                    btnHTML = `
                        <div class="w-full py-3.5 bg-slate-50 text-slate-400 font-black rounded-xl border border-slate-200/80 text-center text-xs flex items-center justify-center gap-2 select-none">
                            <i data-lucide="lock" size="16" class="text-slate-400"></i> Locked — Under Review
                        </div>`;
                } else if (overallStatus === 'Approved') {
                    btnHTML = `
                        <div class="w-full py-3.5 bg-green-50 text-green-700 font-black rounded-xl border border-green-200 text-center text-xs flex items-center justify-center gap-2 select-none shadow-sm">
                            <i data-lucide="check-circle" size="16"></i> Certified & Approved
                        </div>`;
                } else if (overallStatus === 'Rejected') {
                    btnHTML = `
                        <button onclick="window.location.href='TakeExam.html?id=${id}'" 
                            class="w-full py-3.5 bg-red-600 text-white font-black rounded-xl hover:bg-red-700 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-sm">
                            <i data-lucide="alert-triangle" size="16"></i> Retake Exam
                        </button>`;

                    let feedbackList = [];
                    if (leaderApp.status === 'Rejected' && leaderApp.reason) {
                        feedbackList.push(`<strong>Leader:</strong> "${leaderApp.reason}"`);
                    }
                    if (execApp.status === 'Rejected' && execApp.reason) {
                        feedbackList.push(`<strong>Executive:</strong> "${execApp.reason}"`);
                    }

                    if (feedbackList.length > 0) {
                        rejectionFeedbackHTML = `
                            <div class="mt-4 p-3.5 bg-red-50 border border-red-100 rounded-xl text-[11px] text-red-700 space-y-1.5 shadow-sm">
                                <p class="font-black uppercase tracking-wider text-[10px] text-red-500 flex items-center gap-1.5 border-b border-red-100 pb-1.5 mb-1.5">
                                    <i data-lucide="message-square" size="12"></i> Rejection Feedback
                                </p>
                                ${feedbackList.map(f => `<p class="leading-relaxed font-semibold">${f}</p>`).join('')}
                            </div>`;
                    }
                }
            }

            // Updated Author Info Block
            const authorInfo = `
                <div class="mt-4 p-4 bg-slate-50 border border-slate-100 rounded-2xl text-[12px] text-slate-500 font-medium space-y-2.5">
                    <p class="flex items-center gap-2">
                        <i data-lucide="user" size="14" class="text-slate-400"></i> Creator Name: 
                        <span class="text-slate-700 font-bold ml-auto">${creator.name || 'Admin'}</span>
                    </p>
                    <p class="flex items-center gap-2">
                        <i data-lucide="id-card" size="14" class="text-slate-400"></i> Creator ID: 
                        <span class="text-slate-700 font-bold ml-auto">${creatorId}</span>
                    </p>
                    <p class="flex items-center gap-2">
                        <i data-lucide="calendar" size="14" class="text-slate-400"></i> Date Created: 
                        <span class="text-slate-700 font-bold ml-auto">${dateStr}</span>
                    </p>
                    <p class="flex items-center gap-2">
                        <i data-lucide="clock" size="14" class="text-slate-400"></i> Timestamp: 
                        <span class="text-slate-700 font-bold ml-auto">${timeStr}</span>
                    </p>
                </div>`;

            return `
                <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 flex flex-col justify-between group">
                    <div>
                        <div class="flex justify-between items-start gap-4 mb-3">
                            <h4 class="font-black text-lg leading-tight text-slate-800 group-hover:text-blue-700 transition-colors">${exam.title}</h4>
                            <div class="mt-1">${statusBadge}</div>
                        </div>
                        <p class="text-xs font-bold text-slate-400 flex items-center gap-1.5 mb-4">
                            <i data-lucide="timer" size="14" class="text-blue-500"></i> Time Limit: ${exam.timeLimitMinutes || 0} Mins
                        </p>
                        
                        ${authorInfo}
                        ${submittedToHTML}
                        ${approvalProgressHTML}
                        ${rejectionFeedbackHTML}
                    </div>
                    <div class="mt-6 pt-5 border-t border-slate-100">${btnHTML}</div>
                </div>`;
        }

        initApp();
    </script>
</body>

</html>
