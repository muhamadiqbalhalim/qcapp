<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leader Dashboard | QC Team</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Custom scrollbar for clean, non-intrusive scrolling in lists */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f8fafc;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900 font-sans antialiased">

    <div id="main-content" style="display: none;">
        <div class="flex flex-col md:flex-row min-h-screen">
            <div id="sidebar-container" class="w-full md:w-auto md:sticky md:top-0 md:h-screen z-50 shrink-0"></div>

            <main class="flex-1 p-4 md:p-8 overflow-y-auto">
                <header class="mb-8 border-b border-slate-200 pb-6 mt-2 md:mt-0 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                    <div>
                        <p class="text-[11px] uppercase tracking-widest text-purple-600 font-black mb-1.5 flex items-center gap-1.5">
                            <i data-lucide="layout-dashboard" size="14"></i> Management Hub
                        </p>
                        <h1 class="text-3xl md:text-4xl font-black tracking-tight flex items-center flex-wrap gap-3 text-slate-800">
                            Welcome, <span id="userName" class="text-purple-700">Loading...</span>
                            <span id="leaderBadge" class="inline-flex items-center gap-1.5 text-[10px] font-black px-3 py-1.5 rounded-lg shadow-sm uppercase tracking-wider shrink-0 mt-1 sm:mt-0">
                                <i data-lucide="award" size="14"></i> <span id="badgeText">Loading</span>
                            </span>
                        </h1>
                    </div>
                </header>

                <section class="grid grid-cols-1 sm:grid-cols-3 gap-5 mb-8">
                    <div class="p-6 bg-white border border-slate-200 rounded-3xl shadow-sm hover:-translate-y-1 hover:shadow-md transition-all duration-300">
                        <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center mb-4 text-slate-500">
                            <i data-lucide="fingerprint" size="20"></i>
                        </div>
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Employee ID</p>
                        <p id="statId" class="text-2xl font-black mt-1 text-slate-800">-</p>
                    </div>
                    <div class="p-6 bg-white border border-slate-200 rounded-3xl shadow-sm hover:-translate-y-1 hover:shadow-md transition-all duration-300">
                        <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center mb-4 text-blue-500">
                            <i data-lucide="building-2" size="20"></i>
                        </div>
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Department</p>
                        <p id="statDept" class="text-2xl font-black mt-1 text-slate-800">-</p>
                    </div>
                    <div class="p-6 bg-white border border-slate-200 rounded-3xl shadow-sm hover:-translate-y-1 hover:shadow-md transition-all duration-300">
                        <div class="w-10 h-10 rounded-full bg-purple-50 flex items-center justify-center mb-4 text-purple-500">
                            <i data-lucide="shield-half" size="20"></i>
                        </div>
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Role</p>
                        <p id="statRole" class="text-2xl font-black mt-1 text-purple-700">QC Leader</p>
                    </div>
                </section>

                <section class="bg-white p-6 md:p-8 rounded-3xl border border-slate-200 shadow-sm mb-8 relative overflow-hidden">
                    <div class="absolute -top-24 -right-24 w-48 h-48 bg-purple-50 rounded-full blur-3xl opacity-60 pointer-events-none"></div>

                    <div class="flex items-center justify-between mb-6 border-b border-slate-100 pb-4 relative z-10">
                        <div>
                            <h3 class="font-black text-xl flex items-center gap-2 text-slate-800">
                                <i data-lucide="radar" size="22" class="text-purple-600"></i> Team Skill Proficiency Map
                            </h3>
                            <p class="text-xs font-bold text-slate-400 mt-1">Real-time aggregate of multi-level metrics</p>
                        </div>
                        <button id="btnChartInfo" class="text-slate-400 hover:text-purple-600 transition p-2 hover:bg-purple-50 rounded-xl">
                            <i data-lucide="info" size="20"></i>
                        </button>
                    </div>
                    
                    <div class="max-w-xs md:max-w-md mx-auto relative z-10">
                        <canvas id="teamSkillsChart"></canvas>
                    </div>
                </section>

                <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <!-- All Trainings Column with Filters -->
                    <div class="bg-slate-50/50 p-6 rounded-3xl border border-slate-200 flex flex-col h-[500px]">
                        <div class="mb-4 pb-4 border-b border-slate-200 shrink-0 space-y-3">
                            <h3 class="font-black text-lg flex items-center gap-2 text-slate-800">
                                <i data-lucide="graduation-cap" size="20" class="text-purple-600"></i> All Training List
                            </h3>
                            
                            <!-- Search & Filter Controls -->
                            <div class="flex flex-col sm:flex-row gap-2">
                                <div class="relative flex-1">
                                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size="14"></i>
                                    <input type="text" id="searchTraining" placeholder="  Search trainings..." class="w-full pl-8 pr-3 py-2 text-xs font-bold rounded-xl border border-slate-200 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 bg-white transition-all shadow-sm">
                                </div>
                                <select id="filterTraining" class="text-xs font-bold rounded-xl border border-slate-200 px-3 py-2 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 bg-white cursor-pointer shadow-sm w-full sm:w-auto">
                                    <option value="all">All Dates</option>
                                    <option value="upcoming">Upcoming</option>
                                    <option value="past">Past</option>
                                </select>
                            </div>
                        </div>

                        <div id="trainingList" class="space-y-4 flex-1 overflow-y-auto pr-2 custom-scrollbar">
                            <div class="flex flex-col items-center justify-center h-full space-y-2">
                                <i data-lucide="loader-2" class="animate-spin text-purple-400" size="24"></i>
                                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Loading...</p>
                            </div>
                        </div>
                    </div>

                    <!-- Assessments Queue Column -->
                    <div class="bg-slate-50/50 p-6 rounded-3xl border border-slate-200 flex flex-col h-[500px]">
                        <h3 class="font-black text-lg mb-5 flex items-center justify-between gap-2 text-slate-800 pb-4 border-b border-slate-200 shrink-0">
                            <span class="flex items-center gap-2">
                                <i data-lucide="list-todo" size="20" class="text-blue-600"></i> Assessment Queue
                            </span>
                            <span class="bg-blue-100 text-blue-700 text-[10px] font-black px-2 py-1 rounded-md uppercase tracking-wider">Requires Action</span>
                        </h3>
                        <div id="submissionList" class="space-y-4 flex-1 overflow-y-auto pr-2 custom-scrollbar">
                            <div class="flex flex-col items-center justify-center h-full space-y-2">
                                <i data-lucide="loader-2" class="animate-spin text-blue-400" size="24"></i>
                                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Loading...</p>
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <div id="loading" class="flex justify-center items-center h-screen bg-[#F8FAFC]">
        <div class="text-center">
            <i data-lucide="loader-2" class="animate-spin text-purple-600 mx-auto" size="48"></i>
            <p class="text-[11px] font-black text-slate-400 uppercase tracking-widest mt-4">Initializing Leader Module...</p>
        </div>
    </div>

    <script type="module">
        import { db } from './js/FirebaseConfig.js';
        import { collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        import { loadSidebar } from './js/sidebar-loader.js';
        import { RoleManager, ROLES } from './js/Roles.js';

        let globalTrainings = []; 

        function initChart() {
            const ctx = document.getElementById('teamSkillsChart').getContext('2d');
            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['Quality', 'Safety', 'Problem Solving', 'Speed', 'Technical'],
                    datasets: [{
                        label: 'Team Overall Average (%)',
                        data: [85, 90, 80, 75, 88],
                        backgroundColor: 'rgba(147, 51, 234, 0.1)',
                        borderColor: 'rgba(147, 51, 234, 1)',
                        borderWidth: 2.5,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: 'rgba(147, 51, 234, 1)',
                        pointBorderWidth: 2,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    scales: { 
                        r: { 
                            beginAtZero: true, 
                            max: 100,
                            ticks: { backdropColor: 'transparent', stepSize: 20, font: { weight: 'bold' } },
                            grid: { color: 'rgba(0,0,0,0.05)' },
                            angleLines: { color: 'rgba(0,0,0,0.05)' }
                        } 
                    },
                    plugins: { legend: { display: false } }
                }
            });

            document.getElementById('btnChartInfo').addEventListener('click', () => {
                alert("Team Skill Proficiency Map reflects the real-time average multi-level operational metrics compiled from verified operator field inspections and certification exam points across your direct department.");
            });
        }

        function setupSidebarToggle() {
            document.addEventListener('click', (e) => {
                const toggleBtn = e.target.closest('#mobileMenuBtn') || e.target.closest('#mobileSidebarToggle');
                const closeBtn = e.target.closest('#closeMenuBtn');
                const overlay = e.target.closest('#mobileOverlay') || e.target.closest('#sidebarBackdrop');

                const sidebarMenu = document.getElementById('sidebarMenu') || document.getElementById('mainSidebar');
                const mobileOverlay = document.getElementById('mobileOverlay') || document.getElementById('sidebarBackdrop');

                if (!sidebarMenu) return;

                if (toggleBtn) {
                    sidebarMenu.classList.remove('-translate-x-full');
                    if (mobileOverlay) {
                        mobileOverlay.classList.remove('hidden');
                        setTimeout(() => mobileOverlay.classList.add('opacity-100'), 10);
                    }
                    document.body.style.overflow = 'hidden'; 
                }

                if (closeBtn || overlay) {
                    sidebarMenu.classList.add('-translate-x-full');
                    if (mobileOverlay) {
                        mobileOverlay.classList.remove('opacity-100');
                        setTimeout(() => mobileOverlay.classList.add('hidden'), 200);
                    }
                    document.body.style.overflow = ''; 
                }
            });
        }

        function renderLeaderBadge(session) {
            const badgeEl = document.getElementById('leaderBadge');
            const textEl = document.getElementById('badgeText');
            
            const idNum = parseInt(session.employeeId || "0", 10) || 12;
            if (idNum % 2 === 0) {
                badgeEl.className = "inline-flex items-center gap-1.5 text-[10px] font-black px-3 py-1.5 rounded-lg bg-amber-50 text-amber-700 border border-amber-200 uppercase tracking-widest shadow-sm mt-1 sm:mt-0 shrink-0";
                textEl.innerText = "Gold Leader";
            } else {
                badgeEl.className = "inline-flex items-center gap-1.5 text-[10px] font-black px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700 border border-slate-200 uppercase tracking-widest shadow-sm mt-1 sm:mt-0 shrink-0";
                textEl.innerText = "Silver Leader";
            }
        }

        function renderTrainingsList() {
            const trainingList = document.getElementById('trainingList');
            const searchText = document.getElementById('searchTraining').value.toLowerCase();
            const filterType = document.getElementById('filterTraining').value;
            
            trainingList.innerHTML = "";

            const today = new Date(); 
            today.setHours(0,0,0,0);

            let filtered = globalTrainings.filter(training => {
                const tName = (training.name || "").toLowerCase();
                if (searchText && !tName.includes(searchText)) return false;

                const tDate = new Date(training.dateString || 0);
                tDate.setHours(0,0,0,0);

                if (filterType === 'upcoming' && tDate < today) return false;
                if (filterType === 'past' && tDate >= today) return false;

                return true;
            });

            if (filtered.length === 0) {
                trainingList.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full p-6 text-center">
                        <div class="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center mb-3">
                            <i data-lucide="search-x" size="24" class="text-slate-400"></i>
                        </div>
                        <p class="text-sm font-bold text-slate-500">No trainings found.</p>
                        <p class="text-[11px] text-slate-400 mt-1">Try adjusting your search or filter.</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            filtered.forEach(training => {
                const tDate = new Date(training.dateString || 0);
                tDate.setHours(0,0,0,0);
                const isUpcoming = tDate >= today;

                let badgeColor = isUpcoming ? "bg-purple-50 text-purple-700 border-purple-200" : "bg-slate-100 text-slate-600 border-slate-200";
                let badgeText = isUpcoming ? "Upcoming" : "Past Event";

                trainingList.innerHTML += `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-white border border-slate-200 rounded-2xl gap-4 hover:shadow-md hover:border-purple-200 transition-all group">
                        <div class="space-y-2 truncate">
                            <p class="font-black text-slate-800 text-[15px] truncate group-hover:text-purple-700 transition-colors">${training.name}</p>
                            <div class="flex flex-wrap items-center gap-3 text-[11px] font-bold text-slate-500 truncate">
                                <span class="flex items-center gap-1"><i data-lucide="calendar" size="12" class="text-purple-400"></i> ${training.dateString || '-'}</span>
                                <span class="flex items-center gap-1"><i data-lucide="map-pin" size="12" class="text-purple-400"></i> ${training.where || 'N/A'}</span>
                            </div>
                            <div><span class="inline-block px-2.5 py-1 rounded-md text-[10px] font-black uppercase tracking-wider border ${badgeColor}">${badgeText}</span></div>
                        </div>
                        <div class="mt-1 sm:mt-0 shrink-0 w-full sm:w-auto">
                            <a href="TrainingDetails.html?id=${training.id}" class="w-full sm:w-auto px-4 py-2.5 bg-slate-100 text-slate-700 hover:text-purple-700 rounded-xl text-xs font-black hover:bg-purple-50 active:scale-[0.98] transition-all flex items-center justify-center gap-1.5 border border-slate-200 hover:border-purple-200">
                                <i data-lucide="eye" size="14"></i> View Details
                            </a>
                        </div>
                    </div>`;
            });

            lucide.createIcons();
        }

        async function initDashboard() {
            try {
                RoleManager.enforceStrictSession();
                RoleManager.protectPage(ROLES.QC_LEADER);

                const session = JSON.parse(localStorage.getItem('session'));
                if (!session) { RoleManager.forceLogout(); return; }

                await loadSidebar('SidebarLeader.html');
                setupSidebarToggle();
                initChart();
                renderLeaderBadge(session);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';

                const userId = session.employeeId || session.id;
                document.getElementById('userName').innerText = session.name || "Leader";
                document.getElementById('statId').innerText = userId || "-";
                document.getElementById('statDept').innerText = session.department || "QC";

                // =========================================================
                // PIPELINE 1: MEMUATKAN SEMUA SENARAI LATIHAN
                // =========================================================
                const trainingSnap = await getDocs(collection(db, "trainings"));
                
                globalTrainings = [];
                trainingSnap.forEach(doc => {
                    globalTrainings.push({ id: doc.id, ...doc.data() });
                });

                globalTrainings.sort((a, b) => new Date(b.dateString || 0) - new Date(a.dateString || 0));

                document.getElementById('searchTraining').addEventListener('input', renderTrainingsList);
                document.getElementById('filterTraining').addEventListener('change', renderTrainingsList);
                renderTrainingsList();

                // =========================================================
                // PIPELINE 2: GILIRAN KELULUSAN ASSESSMENT OPERATOR (EXAMS & INSPECTIONS)
                // =========================================================
                let pendingSubmissions = [];
                const userIdentifiers = [
                    String(session.id || '').trim().toLowerCase(),
                    String(session.uid || '').trim().toLowerCase(),
                    String(session.employeeId || '').trim().toLowerCase()
                ].filter(Boolean);

                function isAssignedToMe(savedReviewerId) {
                    if (!savedReviewerId) return false;
                    return userIdentifiers.includes(String(savedReviewerId).trim().toLowerCase());
                }

                // 1. Fetch Exams
                const examsSnap = await getDocs(collection(db, "qc_exam_submissions"));
                examsSnap.forEach(doc => {
                    const data = doc.data();
                    const lStatus = data.leaderApproval?.status || "Pending";
                    // Filter: Assigned to this leader AND not yet Approved/Rejected (Still Pending)
                    if (isAssignedToMe(data.leaderId) && lStatus !== "Approved" && lStatus !== "Rejected") {
                        pendingSubmissions.push({ 
                            id: doc.id, 
                            type: 'Exam', 
                            title: data.examTitle || data.examName || 'QC Exam', 
                            ...data 
                        });
                    }
                });

                // 2. Fetch Inspections
                const inspSnap = await getDocs(collection(db, "qc_inspection_submissions"));
                inspSnap.forEach(doc => {
                    const data = doc.data();
                    const lStatus = data.leaderApproval?.status || "Pending";
                    // Filter: Assigned to this leader AND not yet Approved/Rejected (Still Pending)
                    if (isAssignedToMe(data.leaderId) && lStatus !== "Approved" && lStatus !== "Rejected") {
                        pendingSubmissions.push({ 
                            id: doc.id, 
                            type: 'Inspection', 
                            title: data.templateTitle || 'Field Audit', 
                            ...data 
                        });
                    }
                });

                const submissionList = document.getElementById('submissionList');
                submissionList.innerHTML = "";

                if (pendingSubmissions.length === 0) {
                    submissionList.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full p-6 text-center">
                            <div class="w-12 h-12 bg-green-50 rounded-full flex items-center justify-center mb-3 shadow-sm border border-green-100">
                                <i data-lucide="badge-check" size="24" class="text-green-500"></i>
                            </div>
                            <p class="text-sm font-bold text-slate-500">No pending assessments.</p>
                            <p class="text-[11px] text-slate-400 mt-1">Your queue is empty!</p>
                        </div>`;
                } else {
                    pendingSubmissions.forEach(s => {
                        const isExam = s.type === 'Exam';
                        const iconColor = isExam ? "text-blue-500" : "text-amber-500";
                        const iconName = isExam ? "file-text" : "clipboard-check";
                        
                        const typeBadge = isExam 
                            ? `<span class="inline-block px-2 py-0.5 rounded-md text-[9px] font-black uppercase tracking-wider border bg-blue-50 text-blue-700 border-blue-200">Exam</span>`
                            : `<span class="inline-block px-2 py-0.5 rounded-md text-[9px] font-black uppercase tracking-wider border bg-amber-50 text-amber-700 border-amber-200">Inspection</span>`;

                        submissionList.innerHTML += `
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-white border border-slate-200 rounded-2xl gap-4 hover:shadow-md hover:border-blue-200 transition-all group">
                                <div class="space-y-2 truncate">
                                    <p class="font-black text-slate-800 text-[15px] truncate group-hover:text-blue-700 transition-colors">${s.operatorName || "Anonymous Operator"}</p>
                                    <p class="text-[11px] font-bold text-slate-500 flex items-center gap-1.5 truncate">
                                        <i data-lucide="${iconName}" size="14" class="${iconColor}"></i> ${s.title}
                                    </p>
                                    <div class="flex items-center gap-2">
                                        ${typeBadge}
                                        <span class="inline-block px-2 py-0.5 rounded-md text-[9px] font-black uppercase tracking-wider border bg-slate-50 text-slate-500 border-slate-200">Pending Review</span>
                                    </div>
                                </div>
                                <div class="mt-1 sm:mt-0 shrink-0 w-full sm:w-auto">
                                    <a href="ReviewSubmission.html" class="w-full sm:w-auto px-4 py-2.5 bg-blue-600 text-white rounded-xl text-xs font-black hover:bg-blue-700 active:scale-[0.98] transition-all shadow-sm flex items-center justify-center gap-1.5">
                                        <i data-lucide="clipboard-signature" size="14"></i> Review
                                    </a>
                                </div>
                            </div>`;
                    });
                }

                lucide.createIcons();
            } catch (err) {
                console.error("Leader Dashboard Error Fatal:", err);
                alert("Session expired or database linkage error.");
                RoleManager.forceLogout();
            }
        }

        initDashboard();
    </script>
</body>
</html>
