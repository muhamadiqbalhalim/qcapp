<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Dashboard | QC Team</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-[#F8FAFC] text-slate-900 font-sans min-h-screen">

    <div id="mobileOverlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[90] hidden opacity-0 transition-opacity duration-300 md:hidden"></div>

    <div class="flex flex-col md:flex-row min-h-screen relative w-full overflow-hidden">
        
        <div id="sidebar-container" class="fixed inset-y-0 left-0 z-[100] w-[280px] transform -translate-x-full transition-transform duration-300 ease-in-out md:relative md:translate-x-0 md:w-auto md:sticky md:top-0 md:h-screen shrink-0 bg-white md:bg-transparent shadow-2xl md:shadow-none"></div>

        <main class="flex-1 p-4 sm:p-6 md:p-8 overflow-y-auto max-w-7xl mx-auto w-full">
            
            <div class="md:hidden flex items-center justify-between mb-6 bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <div class="flex items-center gap-2">
                    <div class="p-2 bg-amber-100 rounded-lg text-amber-600">
                        <i data-lucide="shield-check" class="w-5 h-5"></i>
                    </div>
                    <p class="text-sm uppercase tracking-[0.15em] text-slate-800 font-black">QC Team</p>
                </div>
                <button id="mobileMenuBtn" class="p-2 bg-slate-50 text-slate-600 rounded-xl hover:bg-slate-100 hover:text-amber-600 transition-colors active:scale-95">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
            </div>

            <header class="mb-8 mt-2 md:mt-0">
                <p class="hidden md:block text-xs uppercase tracking-[0.15em] text-amber-500 font-black mb-1.5">Executive Workspace</p>
                <h1 class="text-3xl sm:text-4xl md:text-5xl font-black tracking-tight text-slate-900">
                    Welcome, <span id="userName" class="text-amber-500">Norhafizah</span>
                </h1>
            </header>

            <section class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
                <div class="p-5 bg-white border border-slate-100 rounded-2xl shadow-sm hover:shadow-md transition-shadow">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Employee ID</p>
                    <p id="statId" class="text-xl font-black mt-1 text-slate-800">-</p>
                </div>
                <div class="p-5 bg-white border border-slate-100 rounded-2xl shadow-sm hover:shadow-md transition-shadow">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Department</p>
                    <p id="statDept" class="text-xl font-black mt-1 text-slate-800">-</p>
                </div>
                <div class="p-5 bg-white border border-slate-100 rounded-2xl shadow-sm hover:shadow-md transition-shadow">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Access Role</p>
                    <p class="text-xl font-black mt-1 text-amber-600">Executive</p>
                </div>
            </section>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
                
                <div class="lg:col-span-1 space-y-8">
                    <section class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm hover:shadow-md transition-shadow">
                        <h3 class="font-black text-lg mb-4 flex items-center gap-2 text-slate-800">
                            <i data-lucide="award" class="text-amber-500 w-5 h-5"></i> Skill Proficiency
                        </h3>
                        <div class="w-full max-w-[280px] sm:max-w-xs mx-auto aspect-square flex items-center justify-center">
                            <canvas id="skillsChart"></canvas>
                        </div>
                    </section>
                </div>

                <div class="lg:col-span-2 space-y-8">
                    
                    <section class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 hover:shadow-md transition-shadow">
                        <h3 class="font-black text-lg mb-4 flex items-center gap-2 text-slate-800">
                            <i data-lucide="graduation-cap" class="text-amber-500 w-5 h-5"></i> My Joined Trainings
                        </h3>
                        <div id="pendingTrainingsList" class="space-y-3">
                            <div class="flex items-center gap-3 p-4 text-sm text-slate-500 italic bg-slate-50 rounded-xl">
                                <div class="w-4 h-4 rounded-full border-2 border-amber-500 border-t-transparent animate-spin"></div>
                                Loading joined trainings...
                            </div>
                        </div>
                    </section>

                    <section class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 hover:shadow-md transition-shadow">
                        <h3 class="font-black text-lg mb-4 flex items-center gap-2 text-slate-800">
                            <i data-lucide="inbox" class="text-amber-500 w-5 h-5"></i> New Submissions
                        </h3>
                        <div id="approvalList" class="space-y-3">
                            <div class="flex items-center gap-3 p-4 text-sm text-slate-500 italic bg-slate-50 rounded-xl">
                                <div class="w-4 h-4 rounded-full border-2 border-amber-500 border-t-transparent animate-spin"></div>
                                Loading operational queue...
                            </div>
                        </div>
                    </section>
                    
                </div>
            </div>
        </main>
    </div>

<script type="module">
    import { db } from './js/FirebaseConfig.js';
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
    import { loadSidebar } from './js/sidebar-loader.js';
    import { RoleManager, ROLES } from './js/Roles.js';

    // === Mobile Sidebar Toggle Logic ===
    const sidebar = document.getElementById('sidebar-container');
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const mobileOverlay = document.getElementById('mobileOverlay');

    function toggleSidebar() {
        const isOpen = !sidebar.classList.contains('-translate-x-full');
        
        if (isOpen) {
            // Close Sidebar
            sidebar.classList.add('-translate-x-full');
            mobileOverlay.classList.remove('opacity-100');
            setTimeout(() => mobileOverlay.classList.add('hidden'), 300);
        } else {
            // Open Sidebar
            sidebar.classList.remove('-translate-x-full');
            mobileOverlay.classList.remove('hidden');
            setTimeout(() => mobileOverlay.classList.add('opacity-100'), 10);
        }
    }

    mobileMenuBtn?.addEventListener('click', toggleSidebar);
    mobileOverlay?.addEventListener('click', toggleSidebar);

    // === Chart Initialization ===
    function initChart() {
        const ctx = document.getElementById('skillsChart').getContext('2d');

        new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['Quality', 'Safety', 'Problem Solving', 'Speed', 'Technical'],
                datasets: [{
                    label: 'Proficiency',
                    data: [90, 85, 75, 80, 95],
                    backgroundColor: 'rgba(245, 158, 11, 0.15)',
                    borderColor: 'rgba(245, 158, 11, 1)',
                    borderWidth: 2,
                    pointBackgroundColor: 'rgba(245, 158, 11, 1)',
                    pointHoverBackgroundColor: '#fff',
                    pointHoverBorderColor: 'rgba(245, 158, 11, 1)'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    r: {
                        angleLines: { color: 'rgba(226, 232, 240, 0.8)' },
                        grid: { color: 'rgba(226, 232, 240, 0.8)' },
                        pointLabels: {
                            font: { size: 11, weight: 'bold', family: 'sans-serif' },
                            color: '#475569'
                        },
                        ticks: { display: false },
                        beginAtZero: true,
                        max: 100
                    }
                }
            }
        });
    }

    // === Dashboard Logic ===
    async function initDashboard() {
        try {
            // Security verification
            RoleManager.enforceStrictSession();
            RoleManager.protectPage(ROLES.EXECUTIVE);

            // Side Navigation Engine Initializer
            await loadSidebar('SidebarExecutive.html');

            initChart();

            const session = JSON.parse(localStorage.getItem('session'));
            if (!session) {
                RoleManager.forceLogout();
                return;
            }

            const userId = session.employeeId || session.id;

            document.getElementById('userName').innerText = session.name || "Executive";
            document.getElementById('statId').innerText = userId || "-";
            document.getElementById('statDept').innerText = session.department || "QC";

            // Load Training modules
            const trainingQuery = query(
                collection(db, "trainings"),
                where("joinedUsers", "array-contains", userId)
            );

            const trainingSnap = await getDocs(trainingQuery);
            const pendingList = document.getElementById('pendingTrainingsList');

            if (!trainingSnap.empty) {
                pendingList.innerHTML = "";
                trainingSnap.forEach(doc => {
                    const training = doc.data();
                    pendingList.innerHTML += `
                        <div class="flex sm:items-center justify-between gap-4 p-4 bg-amber-50/40 border border-amber-100 rounded-xl transition-all hover:bg-amber-50/80">
                            <div class="flex items-start gap-3">
                                <div class="p-2 bg-amber-100 text-amber-700 rounded-lg shrink-0 mt-0.5 sm:mt-0">
                                    <i data-lucide="book-open" class="w-4 h-4"></i>
                                </div>
                                <div>
                                    <h4 class="font-bold text-amber-950 text-sm sm:text-base">${training.title || "Untitled Training"}</h4>
                                    <p class="text-xs text-amber-700/70 font-medium">In Progress</p>
                                </div>
                            </div>
                            <a href="TrainingDetails.html?id=${doc.id}"
                               class="text-xs px-4 py-2.5 bg-amber-500 text-white rounded-xl font-bold hover:bg-amber-600 transition-colors shrink-0 self-center shadow-sm">
                                Open Module
                            </a>
                        </div>
                    `;
                });
            } else {
                pendingList.innerHTML = `
                    <div class="text-center py-6 px-4 bg-slate-50 border border-dashed border-slate-200 rounded-2xl">
                        <p class="text-sm text-slate-400 font-medium italic">No active joined trainings assigned.</p>
                    </div>`;
            }

            // Load Verification Submissions
            const approvalQuery = query(
                collection(db, "exam_submissions"),
                where("status", "==", "pending_exec")
            );

            const approvalSnap = await getDocs(approvalQuery);
            const approvalList = document.getElementById('approvalList');

            if (!approvalSnap.empty) {
                approvalList.innerHTML = "";
                approvalSnap.forEach(doc => {
                    const submission = doc.data();
                    approvalList.innerHTML += `
                        <div class="flex sm:items-center justify-between gap-4 p-4 bg-slate-50 border border-slate-200/60 rounded-xl transition-all hover:bg-slate-100/60">
                            <div class="flex items-start gap-3">
                                <div class="p-2 bg-slate-200 text-slate-700 rounded-lg shrink-0 mt-0.5 sm:mt-0">
                                    <i data-lucide="file-signature" class="w-4 h-4"></i>
                                </div>
                                <div>
                                    <h4 class="font-bold text-slate-900 text-sm sm:text-base">${submission.operatorName || "Operator"}</h4>
                                    <p class="text-xs text-slate-500 font-medium">Awaiting Performance Audit</p>
                                </div>
                            </div>
                            <a href="ReviewSubmission.html?id=${doc.id}"
                               class="text-xs px-4 py-2.5 bg-slate-800 text-white rounded-xl font-bold hover:bg-slate-900 transition-colors shrink-0 self-center shadow-sm">
                                Review File
                            </a>
                        </div>
                    `;
                });
            } else {
                approvalList.innerHTML = `
                    <div class="text-center py-6 px-4 bg-slate-50 border border-dashed border-slate-200 rounded-2xl">
                        <p class="text-sm text-slate-400 font-medium italic">All incoming operator submissions clear.</p>
                    </div>`;
            }

            lucide.createIcons();

        } catch (err) {
            console.error("Executive Dashboard Initialization Error:", err);
            RoleManager.forceLogout();
        }
    }

    initDashboard();
</script>
</body>
</html>
