<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Dashboard | QC Team</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Custom scrollbar untuk daftar list yang panjang agar rapi */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #f59e0b;
        }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900 font-sans antialiased">

    <div id="main-content" style="display: none;">
        <div class="flex flex-col md:flex-row min-h-screen">
            <div id="sidebar-container" class="md:h-screen sticky top-0 z-50"></div>

            <main class="flex-1 p-4 md:p-8 overflow-y-auto">
                <header class="mb-8 border-b border-slate-100 pb-5 mt-2 md:mt-0 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                    <div>
                        <p class="text-xs uppercase tracking-[0.15em] text-amber-600 font-black mb-1">Executive Workspace</p>
                        <h1 class="text-3xl md:text-5xl font-black tracking-tight flex items-center flex-wrap gap-3">
                            Welcome, <span id="userName" class="text-amber-600">Loading...</span>
                            <span id="execBadge" class="inline-flex items-center gap-1.5 text-xs font-black px-3 py-1 rounded-full shadow-xs uppercase tracking-wider">
                                <i data-lucide="award" class="w-3.5 h-3.5"></i> <span id="badgeText">Loading</span>
                            </span>
                        </h1>
                    </div>
                </header>

                <section class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
                    <div class="p-5 bg-white border border-slate-200 rounded-2xl shadow-xs">
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Employee ID</p>
                        <p id="statId" class="text-xl font-black mt-1 text-slate-700">-</p>
                    </div>
                    <div class="p-5 bg-white border border-slate-200 rounded-2xl shadow-xs">
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Department</p>
                        <p id="statDept" class="text-xl font-black mt-1 text-slate-700">-</p>
                    </div>
                    <div class="p-5 bg-white border border-slate-200 rounded-2xl shadow-xs">
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Role</p>
                        <p id="statRole" class="text-xl font-black mt-1 text-amber-700">QC Executive</p>
                    </div>
                </section>

                <section class="bg-white p-6 rounded-3xl border border-slate-200 shadow-xs mb-8">
                    <div class="flex items-center justify-between mb-4 border-b border-slate-50 pb-3">
                        <h3 class="font-black text-lg flex items-center gap-2 text-amber-600">
                            <i data-lucide="shield-check" size="20"></i> Skill Proficiency Map
                        </h3>
                        <button id="btnChartInfo" class="text-slate-400 hover:text-amber-600 transition p-1.5 hover:bg-amber-50 rounded-xl">
                            <i data-lucide="info" class="w-5 h-5"></i>
                        </button>
                    </div>
                    
                    <div class="max-w-xs md:max-w-md mx-auto">
                        <canvas id="skillsChart"></canvas>
                    </div>
                </section>

                <section class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="bg-white p-6 rounded-3xl shadow-xs border border-amber-100 flex flex-col h-[400px]">
                        <h3 class="font-black text-lg mb-4 flex items-center gap-2 text-slate-800 pb-3 border-b border-slate-100 shrink-0">
                            <i data-lucide="graduation-cap" class="text-amber-500"></i> My Joined Trainings
                        </h3>
                        <div id="pendingTrainingsList" class="space-y-3 flex-1 overflow-y-auto pr-1 custom-scrollbar">
                            <p class="text-sm text-slate-400 italic">Loading joined trainings...</p>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-3xl shadow-xs border border-slate-200 flex flex-col h-[400px]">
                        <h3 class="font-black text-lg mb-4 flex items-center gap-2 text-slate-800 pb-3 border-b border-slate-100 shrink-0">
                            <i data-lucide="inbox" class="text-slate-700"></i> New Submissions
                        </h3>
                        <div id="approvalList" class="space-y-3 flex-1 overflow-y-auto pr-1 custom-scrollbar">
                            <p class="text-sm text-slate-400 italic">Loading operational queue...</p>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <div id="loading" class="flex justify-center items-center h-screen bg-[#F8FAFC]">
        <div class="text-center">
            <i data-lucide="loader-2" class="animate-spin text-amber-600 mx-auto" size="40"></i>
            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-3">Loading Executive Module...</p>
        </div>
    </div>

<script type="module">
    import { db } from './js/FirebaseConfig.js';
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
    import { loadSidebar } from './js/sidebar-loader.js';
    import { RoleManager, ROLES } from './js/Roles.js';

    function initChart() {
        const ctx = document.getElementById('skillsChart').getContext('2d');
        new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['Quality', 'Safety', 'Problem Solving', 'Speed', 'Technical'],
                datasets: [{
                    label: 'Proficiency (%)',
                    data: [90, 85, 75, 80, 95],
                    backgroundColor: 'rgba(245, 158, 11, 0.08)',
                    borderColor: 'rgba(245, 158, 11, 1)',
                    borderWidth: 2.5,
                    pointBackgroundColor: 'rgba(245, 158, 11, 1)',
                    pointRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    r: {
                        beginAtZero: true,
                        max: 100,
                        ticks: { backdropColor: 'transparent', stepSize: 20 }
                    }
                },
                plugins: { legend: { display: false } }
            }
        });

        document.getElementById('btnChartInfo').addEventListener('click', () => {
            alert("Skill Proficiency Map reflects your personal tracked professional dimensions across active verification audits and core system capabilities.");
        });
    }

    // Fungsi Pengaktif Mobile Menu Drawer (Menghubungkan Hamburger dari fail Sidebar Luaran)
    function initSidebarMobileEvents() {
        const container = document.getElementById('sidebar-container');
        
        const toggleBtn = container.querySelector("#mobileSidebarToggle");
        const sidebar = container.querySelector("#mainSidebar");
        const backdrop = container.querySelector("#sidebarBackdrop");
        
        if (!toggleBtn || !sidebar || !backdrop) return;

        function toggleSidebar() {
            const isOpen = !sidebar.classList.contains("-translate-x-full");
            if (isOpen) {
                sidebar.classList.add("-translate-x-full");
                backdrop.classList.add("hidden");
                backdrop.classList.remove("opacity-100");
                if (window.lucide) {
                    toggleBtn.innerHTML = '<i data-lucide="menu" class="w-6 h-6"></i>';
                    lucide.createIcons();
                }
            } else {
                sidebar.classList.remove("-translate-x-full");
                backdrop.classList.remove("hidden");
                setTimeout(() => backdrop.classList.add("opacity-100"), 10);
                if (window.lucide) {
                    toggleBtn.innerHTML = '<i data-lucide="x" class="w-6 h-6"></i>';
                    lucide.createIcons();
                }
            }
        }

        toggleBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            toggleSidebar();
        });
        
        backdrop.addEventListener("click", toggleSidebar);
    }

    // Penentuan Badge Gold / Silver Dinamik untuk Executive
    function renderExecBadge(session) {
        const badgeEl = document.getElementById('execBadge');
        const textEl = document.getElementById('badgeText');
        
        const idNum = parseInt(session.employeeId || "0", 10) || 12;
        if (idNum % 2 === 0) {
            badgeEl.className = "inline-flex items-center gap-1.5 text-[10px] font-black px-3 py-1 rounded-full bg-amber-100 text-amber-700 border border-amber-200 uppercase tracking-wider shadow-xs";
            textEl.innerText = "Gold Executive";
        } else {
            badgeEl.className = "inline-flex items-center gap-1.5 text-[10px] font-black px-3 py-1 rounded-full bg-slate-100 text-slate-700 border border-slate-200 uppercase tracking-wider shadow-xs";
            textEl.innerText = "Silver Executive";
        }
    }

    async function initDashboard() {
        try {
            // Security verification
            RoleManager.enforceStrictSession();
            RoleManager.protectPage(ROLES.EXECUTIVE);

            const session = JSON.parse(localStorage.getItem('session'));
            if (!session) { RoleManager.forceLogout(); return; }

            // Ambil fail HTML komponen sidebar luaran
            await loadSidebar('SidebarExecutive.html');
            
            initChart();
            initSidebarMobileEvents();
            renderExecBadge(session);

            // Sembunyikan skrin loading, paparkan workspace utama
            document.getElementById('loading').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';

            const userId = session.employeeId || session.id;

            document.getElementById('userName').innerText = session.name || "Executive";
            document.getElementById('statId').innerText = userId || "-";
            document.getElementById('statDept').innerText = session.department || "QC";

            // =========================================================
            // PIPELINE: MEMUATKAN SENARAI LATIHAN KELAS JAWATAN
            // =========================================================
            const trainingQuery = query(
                collection(db, "trainings"),
                where("joinedUsers", "array-contains", userId)
            );

            const trainingSnap = await getDocs(trainingQuery);
            const pendingList = document.getElementById('pendingTrainingsList');
            pendingList.innerHTML = "";

            if (!trainingSnap.empty) {
                trainingSnap.forEach(doc => {
                    const training = doc.data();
                    pendingList.innerHTML += `
                        <div class="flex items-center justify-between p-4 bg-amber-50/40 border border-amber-100 rounded-2xl gap-4">
                            <div class="space-y-1 truncate">
                                <p class="font-black text-slate-800 text-sm truncate">${training.title || "Untitled Training"}</p>
                                <p class="text-[11px] text-slate-400 font-medium">📅 ${training.dateString || '-'} &nbsp;•&nbsp; 📍 ${training.location || 'N/A'}</p>
                                <span class="inline-block px-2 py-0.5 rounded-md text-[10px] font-bold bg-amber-100 text-amber-700">In Progress</span>
                            </div>
                            <a href="TrainingDetails.html?id=${doc.id}"
                               class="px-3 py-1.5 bg-amber-500 text-white rounded-xl text-xs font-black hover:bg-amber-600 transition-colors shrink-0 shadow-xs">
                                Open Module
                            </a>
                        </div>`;
                });
            } else {
                pendingList.innerHTML = `<p class="text-sm text-slate-400 italic p-2">No active joined trainings assigned.</p>`;
            }

            // =========================================================
            // PIPELINE: GILIRAN KELULUSAN ASSESSMENT OPERATOR (PENDING EXEC)
            // =========================================================
            const approvalQuery = query(
                collection(db, "exam_submissions"),
                where("status", "==", "pending_exec")
            );

            const approvalSnap = await getDocs(approvalQuery);
            const approvalList = document.getElementById('approvalList');
            approvalList.innerHTML = !approvalSnap.empty ? "" : '<p class="text-sm text-slate-400 italic p-2">All incoming operator submissions clear.</p>';

            approvalSnap.forEach(doc => {
                const submission = doc.data();
                approvalList.innerHTML += `
                    <div class="flex justify-between items-center p-4 bg-slate-50 border border-slate-200/60 rounded-2xl gap-4">
                        <div class="truncate">
                            <p class="font-bold text-slate-800 text-sm truncate">${submission.operatorName || "Operator"}</p>
                            <p class="text-[11px] text-slate-500 font-medium truncate">Awaiting Performance Audit</p>
                        </div>
                        <a href="ReviewSubmission.html?id=${doc.id}" class="text-xs px-4 py-2 bg-slate-800 text-white rounded-xl font-black hover:bg-slate-900 transition-colors shrink-0 shadow-xs">
                            Review
                        </a>
                    </div>`;
            });

            lucide.createIcons();

        } catch (err) {
            console.error("Executive Dashboard Initialization Error:", err);
            RoleManager.forceLogout();
        }
    }

    initDashboard();
</script>
</body>
</html>
