<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Dashboard | QC Team</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Custom scrollbar for clean, non-intrusive scrolling in lists */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f8fafc;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #f59e0b;
        }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900 font-sans antialiased">

    <div id="main-content" style="display: none;">
        <div class="flex flex-col md:flex-row min-h-screen">
            <div id="sidebar-container" class="w-full md:w-auto md:sticky md:top-0 md:h-screen z-50 shrink-0"></div>

            <main class="flex-1 p-4 md:p-8 overflow-y-auto w-full">
                <header class="mb-8 border-b border-slate-100 pb-5 mt-2 md:mt-0 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                    <div class="w-full">
                        <p class="text-[11px] md:text-xs uppercase tracking-[0.15em] text-amber-600 font-black mb-1">Executive Workspace</p>
                        <h1 class="text-2xl sm:text-3xl md:text-4xl font-black tracking-tight flex items-center flex-wrap gap-3 text-slate-800">
                            Welcome, <span id="userName" class="text-amber-600 truncate max-w-[200px] sm:max-w-xs md:max-w-md">Loading...</span>
                            <span id="execBadge" class="inline-flex items-center gap-1.5 text-[10px] sm:text-xs font-black px-3 py-1 rounded-full shadow-sm uppercase tracking-wider shrink-0 mt-1 sm:mt-0">
                                <i data-lucide="award" class="w-3.5 h-3.5"></i> <span id="badgeText">Loading</span>
                            </span>
                        </h1>
                    </div>
                </header>

                <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-8">
                    <div class="p-5 md:p-6 bg-white border border-slate-200 rounded-3xl shadow-sm hover:-translate-y-1 hover:shadow-md transition-all duration-300">
                        <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center mb-4 text-slate-500">
                            <i data-lucide="fingerprint" size="20"></i>
                        </div>
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Employee ID</p>
                        <p id="statId" class="text-xl md:text-2xl font-black mt-1 text-slate-700 truncate">-</p>
                    </div>
                    <div class="p-5 md:p-6 bg-white border border-slate-200 rounded-3xl shadow-sm hover:-translate-y-1 hover:shadow-md transition-all duration-300">
                        <div class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center mb-4 text-slate-600">
                            <i data-lucide="building-2" size="20"></i>
                        </div>
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Department</p>
                        <p id="statDept" class="text-xl md:text-2xl font-black mt-1 text-slate-700 truncate">-</p>
                    </div>
                    <div class="p-5 md:p-6 bg-white border border-slate-200 rounded-3xl shadow-sm hover:-translate-y-1 hover:shadow-md transition-all duration-300 sm:col-span-2 lg:col-span-1">
                        <div class="w-10 h-10 rounded-full bg-amber-50 flex items-center justify-center mb-4 text-amber-500">
                            <i data-lucide="shield-check" size="20"></i>
                        </div>
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Role</p>
                        <p id="statRole" class="text-xl md:text-2xl font-black mt-1 text-amber-700 truncate">QC Executive</p>
                    </div>
                </section>

                <section class="bg-white p-5 md:p-6 rounded-3xl border border-slate-200 shadow-sm mb-8 relative overflow-hidden">
                    <div class="absolute -top-24 -right-24 w-48 h-48 bg-amber-50 rounded-full blur-3xl opacity-60 pointer-events-none"></div>

                    <div class="flex items-center justify-between mb-4 border-b border-slate-50 pb-3 relative z-10">
                        <div class="pr-2">
                            <h3 class="font-black text-lg md:text-xl flex items-center gap-2 text-amber-600 leading-tight">
                                <i data-lucide="radar" size="22" class="shrink-0"></i> Skill Proficiency Map
                            </h3>
                            <p class="text-[10px] md:text-xs font-bold text-slate-400 mt-1">Real-time aggregate of multi-level metrics</p>
                        </div>
                        <button id="btnChartInfo" class="text-slate-400 hover:text-amber-600 transition p-1.5 hover:bg-amber-50 rounded-xl shrink-0">
                            <i data-lucide="info" class="w-5 h-5"></i>
                        </button>
                    </div>
                    
                    <div class="w-full max-w-xs sm:max-w-sm md:max-w-md mx-auto relative z-10">
                        <canvas id="skillsChart"></canvas>
                    </div>
                </section>

                <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <!-- All Trainings Column with Filters -->
                    <div class="bg-slate-50/50 p-5 md:p-6 rounded-3xl border border-slate-200 flex flex-col h-[450px] md:h-[500px]">
                        <div class="mb-4 pb-4 border-b border-slate-200 shrink-0 space-y-3">
                            <h3 class="font-black text-base md:text-lg flex items-center gap-2 text-slate-800">
                                <i data-lucide="graduation-cap" size="20" class="text-amber-600"></i> All Training List
                            </h3>
                            
                            <!-- Search & Filter Controls -->
                            <div class="flex flex-col sm:flex-row gap-2">
                                <div class="relative flex-1">
                                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size="14"></i>
                                    <input type="text" id="searchTraining" placeholder="   Search trainings..." class="w-full pl-8 pr-3 py-2 text-xs font-bold rounded-xl border border-slate-200 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 bg-white transition-all shadow-sm">
                                </div>
                                <select id="filterTraining" class="text-xs font-bold rounded-xl border border-slate-200 px-3 py-2 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 bg-white cursor-pointer shadow-sm w-full sm:w-auto">
                                    <option value="all">All Dates</option>
                                    <option value="upcoming">Upcoming</option>
                                    <option value="past">Past</option>
                                </select>
                            </div>
                        </div>

                        <div id="trainingList" class="space-y-4 flex-1 overflow-y-auto pr-2 custom-scrollbar">
                            <div class="flex flex-col items-center justify-center h-full space-y-2">
                                <i data-lucide="loader-2" class="animate-spin text-amber-400" size="24"></i>
                                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Loading...</p>
                            </div>
                        </div>
                    </div>

                    <!-- Assessments Queue Column -->
                    <div class="bg-slate-50/50 p-5 md:p-6 rounded-3xl border border-slate-200 flex flex-col h-[450px] md:h-[500px]">
                        <h3 class="font-black text-base md:text-lg mb-5 flex items-center justify-between gap-2 text-slate-800 pb-4 border-b border-slate-200 shrink-0">
                            <span class="flex items-center gap-2">
                                <i data-lucide="list-todo" size="20" class="text-slate-700"></i> Assessment Queue
                            </span>
                            <span class="bg-slate-200 text-slate-700 text-[9px] md:text-[10px] font-black px-2 py-1 rounded-md uppercase tracking-wider text-center">Requires Action</span>
                        </h3>
                        <div id="submissionList" class="space-y-4 flex-1 overflow-y-auto pr-2 custom-scrollbar">
                            <div class="flex flex-col items-center justify-center h-full space-y-2">
                                <i data-lucide="loader-2" class="animate-spin text-slate-400" size="24"></i>
                                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Loading...</p>
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <div id="loading" class="flex justify-center items-center h-screen bg-[#F8FAFC]">
        <div class="text-center">
            <i data-lucide="loader-2" class="animate-spin text-amber-600 mx-auto" size="48"></i>
            <p class="text-[11px] font-black text-slate-400 uppercase tracking-widest mt-4">Initializing Executive Module...</p>
        </div>
    </div>

<script type="module">
    import { db } from './js/FirebaseConfig.js';
    import { collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
    import { loadSidebar } from './js/sidebar-loader.js';
    import { RoleManager, ROLES } from './js/Roles.js';

    let globalTrainings = [];

    function initChart() {
        const canvas = document.getElementById('skillsChart');
        if(!canvas) return;
        const ctx = canvas.getContext('2d');
        new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['Quality', 'Safety', 'Problem Solving', 'Speed', 'Technical'],
                datasets: [{
                    label: 'Proficiency (%)',
                    data: [90, 85, 75, 80, 95],
                    backgroundColor: 'rgba(245, 158, 11, 0.08)',
                    borderColor: 'rgba(245, 158, 11, 1)',
                    borderWidth: 2.5,
                    pointBackgroundColor: 'rgba(245, 158, 11, 1)',
                    pointRadius: 4,
                    pointHoverRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    r: {
                        beginAtZero: true,
                        max: 100,
                        ticks: { backdropColor: 'transparent', stepSize: 20, font: { weight: 'bold', size: 10 } },
                        grid: { color: 'rgba(0,0,0,0.05)' },
                        angleLines: { color: 'rgba(0,0,0,0.05)' }
                    }
                },
                plugins: { legend: { display: false } }
            }
        });

        document.getElementById('btnChartInfo').addEventListener('click', () => {
            alert("Skill Proficiency Map reflects your personal tracked professional dimensions across active verification audits and core system capabilities.");
        });
    }

    function setupSidebarToggle() {
        document.addEventListener('click', (e) => {
            const toggleBtn = e.target.closest('#mobileMenuBtn') || e.target.closest('#mobileSidebarToggle');
            const closeBtn = e.target.closest('#closeMenuBtn');
            const overlay = e.target.closest('#mobileOverlay') || e.target.closest('#sidebarBackdrop');

            const sidebarMenu = document.getElementById('sidebarMenu') || document.getElementById('mainSidebar');
            const mobileOverlay = document.getElementById('mobileOverlay') || document.getElementById('sidebarBackdrop');

            if (!sidebarMenu) return;

            if (toggleBtn) {
                sidebarMenu.classList.remove('-translate-x-full');
                if (mobileOverlay) {
                    mobileOverlay.classList.remove('hidden');
                    setTimeout(() => mobileOverlay.classList.add('opacity-100'), 10);
                }
                document.body.style.overflow = 'hidden'; 
            }

            if (closeBtn || overlay) {
                sidebarMenu.classList.add('-translate-x-full');
                if (mobileOverlay) {
                    mobileOverlay.classList.remove('opacity-100');
                    setTimeout(() => mobileOverlay.classList.add('hidden'), 200);
                }
                document.body.style.overflow = ''; 
            }
        });
    }

    function renderExecBadge(session) {
        const badgeEl = document.getElementById('execBadge');
        const textEl = document.getElementById('badgeText');
        
        const idNum = parseInt(session.employeeId || "0", 10) || 12;
        if (idNum % 2 === 0) {
            badgeEl.className = "inline-flex items-center gap-1.5 text-[10px] font-black px-3 py-1.5 rounded-full bg-amber-100 text-amber-700 border border-amber-200 uppercase tracking-widest shadow-sm mt-1 sm:mt-0 shrink-0";
            textEl.innerText = "Gold Executive";
        } else {
            badgeEl.className = "inline-flex items-center gap-1.5 text-[10px] font-black px-3 py-1.5 rounded-full bg-slate-100 text-slate-700 border border-slate-200 uppercase tracking-widest shadow-sm mt-1 sm:mt-0 shrink-0";
            textEl.innerText = "Silver Executive";
        }
    }

    function renderTrainingsList() {
        const trainingList = document.getElementById('trainingList');
        const searchText = document.getElementById('searchTraining').value.toLowerCase();
        const filterType = document.getElementById('filterTraining').value;
        
        trainingList.innerHTML = "";

        const today = new Date(); 
        today.setHours(0,0,0,0);

        let filtered = globalTrainings.filter(training => {
            const tName = (training.name || training.title || "").toLowerCase();
            if (searchText && !tName.includes(searchText)) return false;

            const tDate = new Date(training.dateString || 0);
            tDate.setHours(0,0,0,0);

            if (filterType === 'upcoming' && tDate < today) return false;
            if (filterType === 'past' && tDate >= today) return false;

            return true;
        });

        if (filtered.length === 0) {
            trainingList.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full p-6 text-center">
                    <div class="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center mb-3">
                        <i data-lucide="search-x" size="24" class="text-slate-400"></i>
                    </div>
                    <p class="text-sm font-bold text-slate-500">No trainings found.</p>
                    <p class="text-[11px] text-slate-400 mt-1">Try adjusting your search or filter.</p>
                </div>`;
            lucide.createIcons();
            return;
        }

        filtered.forEach(training => {
            const tDate = new Date(training.dateString || 0);
            tDate.setHours(0,0,0,0);
            const isUpcoming = tDate >= today;

            let badgeColor = isUpcoming ? "bg-amber-50 text-amber-700 border-amber-200" : "bg-slate-100 text-slate-600 border-slate-200";
            let badgeText = isUpcoming ? "Upcoming" : "Past Event";

            trainingList.innerHTML += `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-white border border-slate-200 rounded-2xl gap-3 sm:gap-4 hover:shadow-md hover:border-amber-200 transition-all group">
                    <div class="space-y-2 truncate w-full sm:w-auto flex-1">
                        <p class="font-black text-slate-800 text-[14px] sm:text-[15px] truncate group-hover:text-amber-700 transition-colors">${training.name || training.title || "Untitled Training"}</p>
                        <div class="flex flex-wrap items-center gap-2 sm:gap-3 text-[10px] sm:text-[11px] font-bold text-slate-500">
                            <span class="flex items-center gap-1 shrink-0"><i data-lucide="calendar" size="12" class="text-amber-500"></i> ${training.dateString || '-'}</span>
                            <span class="flex items-center gap-1 truncate"><i data-lucide="map-pin" size="12" class="text-amber-500"></i> ${training.where || training.location || 'N/A'}</span>
                        </div>
                        <div><span class="inline-block px-2.5 py-1 rounded-md text-[9px] font-black uppercase tracking-wider border ${badgeColor}">${badgeText}</span></div>
                    </div>
                    <div class="mt-2 sm:mt-0 shrink-0 w-full sm:w-auto">
                        <a href="TrainingDetails.html?id=${training.id}" class="w-full sm:w-auto px-4 py-2.5 bg-slate-100 text-slate-700 hover:text-amber-700 rounded-xl text-xs font-black hover:bg-amber-50 active:scale-[0.98] transition-all flex items-center justify-center gap-1.5 border border-slate-200 hover:border-amber-200">
                            <i data-lucide="eye" size="14"></i> View Details
                        </a>
                    </div>
                </div>`;
        });

        lucide.createIcons();
    }

    async function initDashboard() {
        try {
            RoleManager.enforceStrictSession();
            RoleManager.protectPage(ROLES.EXECUTIVE);

            const session = JSON.parse(localStorage.getItem('session'));
            if (!session) { RoleManager.forceLogout(); return; }

            await loadSidebar('SidebarExecutive.html');
            setupSidebarToggle();
            setTimeout(initChart, 300); // Slight delay for canvas to render structurally
            renderExecBadge(session);

            document.getElementById('loading').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';

            const userId = session.employeeId || session.id;

            document.getElementById('userName').innerText = session.name || "Executive";
            document.getElementById('statId').innerText = userId || "-";
            document.getElementById('statDept').innerText = session.department || "QC";

            // =========================================================
            // PIPELINE 1: FETCH ALL TRAININGS
            // =========================================================
            const trainingSnap = await getDocs(collection(db, "trainings"));
            
            globalTrainings = [];
            trainingSnap.forEach(doc => {
                globalTrainings.push({ id: doc.id, ...doc.data() });
            });

            globalTrainings.sort((a, b) => new Date(b.dateString || 0) - new Date(a.dateString || 0));

            document.getElementById('searchTraining').addEventListener('input', renderTrainingsList);
            document.getElementById('filterTraining').addEventListener('change', renderTrainingsList);
            renderTrainingsList();

            // =========================================================
            // PIPELINE 2: FETCH ASSIGNMENTS IN-MEMORY (FIXED COLLECTIONS)
            // =========================================================
            let pendingSubmissions = [];

            // We identify the user across different possible ID keys
            const userIdentifiers = [
                String(session.id || '').trim().toLowerCase(),
                String(session.uid || '').trim().toLowerCase(),
                String(session.employeeId || '').trim().toLowerCase()
            ].filter(Boolean);

            function isAssignedToExec(data) {
                const execId = data.execId || data.executiveId || data.reviewerId; 
                if (!execId) return false;
                return userIdentifiers.includes(String(execId).trim().toLowerCase());
            }

            // 1. Fetch from qc_exam_submissions (Fixed collection name)
            const examSnap = await getDocs(collection(db, "qc_exam_submissions"));
            examSnap.forEach(doc => {
                const data = doc.data();
                const eStatus = data.execApproval?.status || "Pending";
                // If it belongs to this exec and exec hasn't finalized it yet
                if (isAssignedToExec(data) && eStatus !== "Approved" && eStatus !== "Rejected") {
                    pendingSubmissions.push({ 
                        id: doc.id, 
                        type: 'Exam', 
                        title: data.examTitle || data.examName || 'QC Exam', 
                        ...data 
                    });
                }
            });

            // 2. Fetch from qc_inspection_submissions (Fixed collection name)
            const inspSnap = await getDocs(collection(db, "qc_inspection_submissions"));
            inspSnap.forEach(doc => {
                const data = doc.data();
                const eStatus = data.execApproval?.status || "Pending";
                if (isAssignedToExec(data) && eStatus !== "Approved" && eStatus !== "Rejected") {
                    pendingSubmissions.push({ 
                        id: doc.id, 
                        type: 'Inspection', 
                        title: data.templateTitle || 'Field Audit', 
                        ...data 
                    });
                }
            });

            const submissionList = document.getElementById('submissionList');
            submissionList.innerHTML = "";

            if (pendingSubmissions.length === 0) {
                submissionList.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full p-6 text-center">
                        <div class="w-12 h-12 bg-green-50 rounded-full flex items-center justify-center mb-3 shadow-sm border border-green-100">
                            <i data-lucide="badge-check" size="24" class="text-green-500"></i>
                        </div>
                        <p class="text-sm font-bold text-slate-500">No pending assessments.</p>
                        <p class="text-[11px] text-slate-400 mt-1">Your queue is clear!</p>
                    </div>`;
            } else {
                // Sort to bring most recent to top (assuming date object/string exists)
                pendingSubmissions.sort((a, b) => new Date(b.timestamp || 0) - new Date(a.timestamp || 0));

                pendingSubmissions.forEach(s => {
                    const isExam = s.type === 'Exam';
                    const iconColor = isExam ? "text-slate-600" : "text-amber-500";
                    const iconName = isExam ? "file-text" : "clipboard-check";
                    
                    const typeBadge = isExam 
                        ? `<span class="inline-block px-2 py-0.5 rounded-md text-[9px] font-black uppercase tracking-wider border bg-slate-100 text-slate-700 border-slate-200">Exam</span>`
                        : `<span class="inline-block px-2 py-0.5 rounded-md text-[9px] font-black uppercase tracking-wider border bg-amber-50 text-amber-700 border-amber-200">Inspection</span>`;

                    // We direct them to the ReviewSubmission board
                    submissionList.innerHTML += `
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-white border border-slate-200 rounded-2xl gap-3 sm:gap-4 hover:shadow-md hover:border-slate-300 transition-all group">
                            <div class="space-y-2 truncate w-full sm:w-auto flex-1">
                                <p class="font-black text-slate-800 text-[14px] sm:text-[15px] truncate group-hover:text-amber-600 transition-colors">${s.operatorName || "Anonymous Operator"}</p>
                                <p class="text-[10px] sm:text-[11px] font-bold text-slate-500 flex items-center gap-1.5 truncate">
                                    <i data-lucide="${iconName}" size="14" class="${iconColor} shrink-0"></i> <span class="truncate">${s.title}</span>
                                </p>
                                <div class="flex items-center gap-2">
                                    ${typeBadge}
                                    <span class="inline-block px-2 py-0.5 rounded-md text-[9px] font-black uppercase tracking-wider border bg-slate-50 text-slate-500 border-slate-200">Needs Review</span>
                                </div>
                            </div>
                            <div class="mt-2 sm:mt-0 shrink-0 w-full sm:w-auto">
                                <a href="ReviewSubmission.html" class="w-full sm:w-auto px-4 py-2.5 bg-slate-800 text-white rounded-xl text-xs font-black hover:bg-slate-900 active:scale-[0.98] transition-all shadow-sm flex items-center justify-center gap-1.5">
                                    <i data-lucide="clipboard-signature" size="14"></i> Open Board
                                </a>
                            </div>
                        </div>`;
                });
            }

            lucide.createIcons();
        } catch (err) {
            console.error("Executive Dashboard Error Fatal:", err);
            alert("Session expired or database linkage error.");
            RoleManager.forceLogout();
        }
    }

    // Handle resize safely for the chart
    window.addEventListener('resize', () => {
        const canvas = document.getElementById('skillsChart');
        if (canvas) {
            canvas.style.height = window.innerWidth < 768 ? '250px' : '300px';
        }
    });

    initDashboard();
</script>
</body>
</html>
