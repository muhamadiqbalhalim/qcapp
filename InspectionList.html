<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspection List | QC Team</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-[#F8FAFC] text-slate-900 font-sans">

    <div class="flex flex-col md:flex-row min-h-screen">
        <div id="sidebar-container" class="w-full md:w-auto md:sticky md:top-0 md:h-screen z-50 shrink-0"></div>

        <main class="flex-1 p-4 md:p-8 overflow-y-auto">
            <header class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-200 pb-6">
                <div>
                    <h1 class="text-3xl md:text-4xl font-black flex items-center gap-3 tracking-tight text-slate-800">
                        <i data-lucide="clipboard-check" class="text-purple-600" size="36"></i> Inspection Management
                    </h1>
                    <p class="text-slate-500 font-semibold text-sm mt-2">Track real-time quality control workflows, compliance statuses, and active review logs.</p>
                </div>
                <button id="newTemplateBtn" onclick="window.location.href='InspectionTemplate.html'"
                    class="hidden bg-purple-600 text-white px-6 py-3.5 rounded-2xl font-black hover:bg-purple-700 shadow-lg hover:shadow-purple-200 active:scale-[0.98] transition flex items-center gap-2 self-start md:self-center">
                    <i data-lucide="plus" size="18"></i> Create Template
                </button>
            </header>

            <div id="inspectionGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                <div id="loader" class="col-span-full flex flex-col items-center justify-center p-12 h-64 space-y-3">
                    <i data-lucide="loader-2" class="animate-spin text-purple-600" size="44"></i>
                    <p class="text-[11px] font-black text-slate-400 uppercase tracking-widest">Synchronizing Database...</p>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { db } from './js/FirebaseConfig.js';
        import { collection, getDocs, orderBy, query, where } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        import { loadSidebar } from './js/sidebar-loader.js';
        import { ROLES, RoleManager } from './js/Roles.js';

        let userRole = null; // Store globally within script module to reference when rendering cards

        async function init() {
            try {
                RoleManager.protectPage(
                    ROLES.QC_LEADER,
                    ROLES.EXECUTIVE,
                    ROLES.QG_OPERATOR
                );

                const session = JSON.parse(localStorage.getItem("session"));
                userRole = session.role;
                let sidebar = "SidebarOperator.html";

                if (userRole === ROLES.QC_LEADER) {
                    sidebar = "SidebarLeader.html";
                } else if (userRole === ROLES.EXECUTIVE) {
                    sidebar = "SidebarExecutive.html";
                }

                await loadSidebar(sidebar);

                // Initialize menu click event configurations immediately after the sidebar finishes injection
                setupSidebarToggle();

                if (userRole === ROLES.QC_LEADER || userRole === ROLES.EXECUTIVE) {
                    document.getElementById("newTemplateBtn").classList.remove("hidden");
                }

                fetchInspections(session);

            } catch (err) {
                console.error("Initialization Error:", err);
            }
        }

        // Standardized Mobile Menu Toggle (Matches Exam Manager exactly)
        function setupSidebarToggle() {
            const container = document.getElementById('sidebar-container');
            
            // Includes fallback checks for different possible IDs in your loaded HTML
            const toggleBtn = container.querySelector("#mobileSidebarToggle") || document.getElementById("mobileSidebarToggle") || document.getElementById('mobileMenuBtn');
            const sidebar = container.querySelector("#mainSidebar") || document.getElementById('sidebarMenu') || container.querySelector("aside");
            const backdrop = container.querySelector("#sidebarBackdrop") || document.getElementById('mobileOverlay') || container.querySelector(".backdrop-blur-sm");
            
            if (!toggleBtn || !sidebar || !backdrop) return;

            function toggleSidebar() {
                const isOpen = !sidebar.classList.contains("-translate-x-full");
                if (isOpen) {
                    sidebar.classList.add("-translate-x-full");
                    backdrop.classList.add("hidden");
                    backdrop.classList.remove("opacity-100");
                    toggleBtn.innerHTML = '<i data-lucide="menu" class="w-6 h-6"></i>';
                    document.body.style.overflow = ''; 
                } else {
                    sidebar.classList.remove("-translate-x-full");
                    backdrop.classList.remove("hidden");
                    setTimeout(() => backdrop.classList.add("opacity-100"), 10);
                    toggleBtn.innerHTML = '<i data-lucide="x" class="w-6 h-6"></i>';
                    document.body.style.overflow = 'hidden'; 
                }
                if (window.lucide) lucide.createIcons();
            }

            toggleBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                toggleSidebar();
            });
            
            backdrop.addEventListener("click", toggleSidebar);

            // Handle sub-component fallback close trigger buttons if they exist
            const closeMenuBtn = container.querySelector("#closeMenuBtn") || document.getElementById('closeMenuBtn');
            if (closeMenuBtn) {
                closeMenuBtn.addEventListener('click', toggleSidebar);
            }
        }

        async function fetchInspections(session) {
            const grid = document.getElementById('inspectionGrid');
            const loader = document.getElementById('loader');

            try {
                // 1. Dapatkan senarai semua pelan induk template audit
                const qTemplates = query(collection(db, "qc_inspection_templates"), orderBy("createdAt", "desc"));
                const snapTemplates = await getDocs(qTemplates);

                // 2. Dapatkan senarai data jawapan audit milik akaun pekerja semasa
                const qSubmissions = query(
                    collection(db, "qc_inspection_submissions"), 
                    where("submittedBy.id", "==", session.employeeId || session.uid)
                );
                const snapSubmissions = await getDocs(qSubmissions);

                // 3. Bina pemetaan objek bagi rujukan pantas berasaskan templateId
                const submissionMap = {};
                snapSubmissions.forEach(subDoc => {
                    const subData = subDoc.data();
                    if (subData.templateId) {
                        subData.submissionId = subDoc.id; 
                        submissionMap[subData.templateId] = subData;
                    }
                });

                loader.classList.add('hidden');

                if (snapTemplates.empty) {
                    grid.innerHTML = renderEmptyState();
                    lucide.createIcons();
                    return;
                }

                let inspectionsList = [];

                snapTemplates.forEach(doc => {
                    const data = doc.data();
                    const templateId = doc.id;
                    const userSubmission = submissionMap[templateId];

                    let sortWeight = 1; 
                    let overallStatus = "Not Started";

                    if (userSubmission) {
                        const leaderApp = userSubmission.leaderApproval || {};
                        const execApp = userSubmission.executiveApproval || userSubmission.exectutiveApproval || {};

                        const isLeaderApproved = leaderApp.status === 'Approved';
                        const isExecApproved = execApp.status === 'Approved';
                        const isAnyRejected = leaderApp.status === 'Rejected' || execApp.status === 'Rejected';

                        if (isLeaderApproved && isExecApproved) {
                            overallStatus = "Approved";
                            sortWeight = 3;
                        } else if (isAnyRejected) {
                            overallStatus = "Rejected";
                            sortWeight = 3;
                        } else {
                            overallStatus = "Pending";
                            sortWeight = 2;
                        }
                    }

                    inspectionsList.push({
                        templateId,
                        data,
                        userSubmission,
                        overallStatus,
                        sortWeight,
                        createdAtMillis: data.createdAt ? data.createdAt.toMillis() : 0 
                    });
                });

                // Isih data: Utamakan tugasan baharu, diikuti tugasan pending dan tugasan selesai
                inspectionsList.sort((a, b) => {
                    if (a.sortWeight !== b.sortWeight) {
                        return a.sortWeight - b.sortWeight;
                    }
                    return b.createdAtMillis - a.createdAtMillis;
                });

                grid.innerHTML = "";
                inspectionsList.forEach(item => {
                    grid.innerHTML += renderInspectionCard(item);
                });

                lucide.createIcons();
            } catch (e) {
                console.error("Fetch Error:", e);
                grid.innerHTML = `<p class="col-span-full text-center text-red-500 font-bold p-12">Failed to load templates or tracking data.</p>`;
            }
        }

        function renderEmptyState() {
            return `
                <div class="col-span-full">
                    <div class="bg-white border border-slate-200 rounded-[28px] p-16 text-center shadow-sm">
                        <div class="flex justify-center mb-5">
                            <div class="w-16 h-16 rounded-full bg-green-100 flex items-center justify-center">
                                <i data-lucide="badge-check" size="32" class="text-green-600"></i>
                            </div>
                        </div>
                        <h2 class="text-3xl font-black text-slate-900 mb-3">You're All Caught Up!</h2>
                        <p class="text-slate-500 text-lg">There are currently no inspection templates available.</p>
                    </div>
                </div>`;
        }

        function renderInspectionCard({ templateId, data, userSubmission, overallStatus }) {
            const lhCount = data.lh?.length || 0;
            const rhCount = data.rh?.length || 0;
            const date = data.createdAt ? data.createdAt.toDate().toLocaleDateString() : 'N/A';
            const creatorName = data.createdBy?.name || data.createdByName || "Unknown";

            let statusBadgeHTML = "";
            let approvalTracksHTML = "";
            let actionButtonHTML = "";
            let rejectionReasonsHTML = "";

            if (!userSubmission) {
                // PAPARAN KAD: JIKA BELUM DIKUNCI / BELUM AMBIL AUDIT
                statusBadgeHTML = `<span class="bg-slate-100 text-slate-600 border border-slate-200 px-3 py-1.5 rounded-lg text-xs font-black uppercase tracking-wider shrink-0 shadow-sm">Not Started</span>`;
                actionButtonHTML = `
                    <button onclick="window.location.href='TakeInspection.html?id=${templateId}'"
                        class="w-full py-3.5 bg-purple-600 text-white font-black rounded-xl hover:bg-purple-700 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-sm">
                        <i data-lucide="play" size="16"></i> Start Inspection
                    </button>`;
            } else {
                // PAPARAN KAD: JIKA DATA BORANG DAH SUBMITTED
                const leaderApp = userSubmission.leaderApproval || {};
                const execApp = userSubmission.executiveApproval || userSubmission.exectutiveApproval || {};

                let badgeClass = "bg-amber-50 text-amber-700 border-amber-200"; 
                if (overallStatus === "Approved") badgeClass = "bg-green-100 text-green-800 border-green-300";
                if (overallStatus === "Rejected") badgeClass = "bg-red-100 text-red-800 border-red-300";

                statusBadgeHTML = `<span class="px-3 py-1.5 rounded-lg border ${badgeClass} text-xs font-black tracking-wider uppercase shrink-0 shadow-sm">${overallStatus}</span>`;

                const isLeaderApproved = leaderApp.status === 'Approved';
                const isExecApproved = execApp.status === 'Approved';

                approvalTracksHTML = `
                    <div class="mt-5 space-y-3">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-dashed border-slate-200 pb-2">Approval Progress</p>
                        <div class="flex items-center justify-between text-xs">
                            <span class="text-slate-500 font-bold flex items-center gap-1.5">
                                <i data-lucide="shield-check" size="14" class="text-slate-400"></i> QC Leader
                            </span>
                            <span class="font-black px-2.5 py-1 rounded-md ${isLeaderApproved ? 'bg-green-50 text-green-600' : (leaderApp.status === 'Rejected' ? 'bg-red-50 text-red-600' : 'bg-amber-50 text-amber-600')}">
                                ${leaderApp.status || 'Pending'}
                            </span>
                        </div>
                        <div class="flex items-center justify-between text-xs">
                            <span class="text-slate-500 font-bold flex items-center gap-1.5">
                                <i data-lucide="user-check" size="14" class="text-slate-400"></i> Executive
                            </span>
                            <span class="font-black px-2.5 py-1 rounded-md ${isExecApproved ? 'bg-green-50 text-green-600' : (execApp.status === 'Rejected' ? 'bg-red-50 text-red-600' : 'bg-amber-50 text-amber-600')}">
                                ${execApp.status || 'Pending'}
                            </span>
                        </div>
                    </div>`;

                // DIKEMASKINI: Logik Kekunci Tindakan Dinamik mengikut standard Enterprise Sistem
                if (overallStatus === "Pending") {
                    actionButtonHTML = `
                        <div class="w-full py-3.5 bg-slate-50 text-slate-400 font-black rounded-xl border border-slate-200/80 text-center text-xs flex items-center justify-center gap-2 select-none">
                            <i data-lucide="lock" size="16" class="text-slate-400"></i> Locked — Under Review
                        </div>`;
                } else if (overallStatus === "Approved") {
                    actionButtonHTML = `
                        <div class="w-full py-3.5 bg-green-50 text-green-700 font-black rounded-xl border border-green-200 text-center text-xs flex items-center justify-center gap-2 select-none shadow-sm">
                            <i data-lucide="check-circle" size="16"></i> Certified & Approved
                        </div>`;
                } else if (overallStatus === "Rejected") {
                    // Jika Rejected, tukar butang untuk membolehkan operator hantar semula (Retake/Redo)
                    actionButtonHTML = `
                        <button onclick="window.location.href='TakeInspection.html?id=${templateId}'"
                            class="w-full py-3.5 bg-red-600 text-white font-black rounded-xl hover:bg-red-700 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-sm">
                            <i data-lucide="alert-triangle" size="16"></i> Retake Inspection
                        </button>`;

                    // Ambil nota ulasan/sebab kenapa audit ditolak oleh penyemak
                    let reasons = [];
                    if (leaderApp.status === 'Rejected' && leaderApp.reason) {
                        reasons.push(`<strong>Leader:</strong> "${leaderApp.reason}"`);
                    }
                    if (execApp.status === 'Rejected' && execApp.reason) {
                        reasons.push(`<strong>Executive:</strong> "${execApp.reason}"`);
                    }

                    if (reasons.length > 0) {
                        rejectionReasonsHTML = `
                            <div class="mt-4 p-3.5 bg-red-50 border border-red-100 rounded-xl text-[11px] text-red-700 space-y-1.5 shadow-sm">
                                <p class="font-black uppercase tracking-wider text-[10px] text-red-500 flex items-center gap-1.5 border-b border-red-100 pb-1.5 mb-1.5">
                                    <i data-lucide="message-square" size="12"></i> Rejection Feedback
                                </p>
                                ${reasons.map(r => `<p class="leading-relaxed font-semibold">${r}</p>`).join('')}
                            </div>`;
                    }
                }
            }

            // INJECT EDIT BUTTON SYSTEM: Semak kebenaran role menggunakan ROLES object rujukan
            if (userRole === ROLES.QC_LEADER || userRole === ROLES.EXECUTIVE) {
                actionButtonHTML = `
                    <div class="flex gap-2">
                        <button onclick="window.location.href='EditInspection.html?editId=${templateId}'"
                            class="flex-1 py-3.5 px-4 bg-purple-600 text-white rounded-xl font-black text-xs uppercase tracking-wider hover:bg-purple-700 transition-colors flex items-center justify-center gap-1.5 shadow-sm">
                            <i data-lucide="edit-3" size="15"></i> Edit Configuration
                        </button>
                    </div>
                `;
            }

            const authorInfo = `
                <div class="mt-5 p-4 bg-slate-50 border border-slate-100 rounded-2xl text-[12px] text-slate-500 font-medium space-y-2.5">
                    <p class="flex items-center gap-2"><i data-lucide="user" size="14" class="text-slate-400"></i> Owner: <span class="text-slate-700 font-bold ml-auto">${creatorName}</span></p>
                    <p class="flex items-center gap-2"><i data-lucide="calendar" size="14" class="text-slate-400"></i> Created: <span class="text-slate-700 font-bold ml-auto">${date}</span></p>
                </div>`;

            return `
                <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 flex flex-col justify-between group">
                    <div>
                        <div class="flex justify-between items-start gap-4 mb-3">
                            <h3 class="font-black text-lg leading-tight text-slate-800 group-hover:text-purple-700 transition-colors">
                                ${data.title || 'Untitled'}
                            </h3>
                            <div class="mt-1">${statusBadgeHTML}</div>
                        </div>

                        <div class="flex flex-wrap gap-2 mt-4 text-xs font-bold">
                            <span class="px-2.5 py-1.5 rounded-lg bg-amber-50 text-amber-700 border border-amber-100 flex items-center gap-1"><i data-lucide="align-left" size="12"></i> LH ${lhCount} items</span>
                            <span class="px-2.5 py-1.5 rounded-lg bg-blue-50 text-blue-700 border border-blue-100 flex items-center gap-1"><i data-lucide="align-right" size="12"></i> RH ${rhCount} items</span>
                        </div>

                        ${authorInfo}
                        ${approvalTracksHTML}
                        ${rejectionReasonsHTML}
                    </div>
                    
                    <div class="mt-6 pt-5 border-t border-slate-100">${actionButtonHTML}</div>
                </div>`;
        }

        init();
    </script>
</body>

</html>
