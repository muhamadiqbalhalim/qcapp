<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspection List | QC Team</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-[#F8FAFC] text-slate-900 font-sans">

    <div class="flex flex-col md:flex-row min-h-screen">
        <div id="sidebar-container" class="md:h-screen sticky top-0 z-50"></div>

        <main class="flex-1 p-4 md:p-8 overflow-y-auto">
            <header class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h1 class="text-3xl font-black tracking-tight">Inspection Management</h1>
                    <p class="text-slate-500 font-bold text-sm mt-0.5">Track real-time quality control workflows, compliance statuses, and active review logs.</p>
                </div>
                <button id="newTemplateBtn" onclick="window.location.href='InspectionTemplate.html'"
                    class="hidden bg-purple-600 text-white px-6 py-3 rounded-2xl font-black hover:bg-purple-700 shadow-lg hover:shadow-purple-200 active:scale-[0.98] transition">
                    + Create Template
                </button>
            </header>

            <div id="inspectionGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <div id="loader" class="col-span-full flex flex-col items-center justify-center p-12 space-y-3">
                    <i data-lucide="loader-2" class="animate-spin text-purple-600" size="40"></i>
                    <p class="text-xs font-black text-slate-400 uppercase tracking-widest">Synchronizing Database...</p>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { db } from './js/FirebaseConfig.js';
        import { collection, getDocs, orderBy, query, where } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        import { loadSidebar } from './js/sidebar-loader.js';
        import { ROLES, RoleManager } from './js/Roles.js';

        async function init() {
            try {
                RoleManager.protectPage(
                    ROLES.QC_LEADER,
                    ROLES.EXECUTIVE,
                    ROLES.QG_OPERATOR
                );

                const session = JSON.parse(localStorage.getItem("session"));
                const role = session.role;
                let sidebar = "SidebarOperator.html";

                if (role === ROLES.QC_LEADER) {
                    sidebar = "SidebarLeader.html";
                } else if (role === ROLES.EXECUTIVE) {
                    sidebar = "SidebarExecutive.html";
                }

                await loadSidebar(sidebar);

                // AKTIFKAN FIX: Pasang kawalan pemicu menu sisi untuk peranti mobile
                setupSidebarToggle();

                if (role === ROLES.QC_LEADER || role === ROLES.EXECUTIVE) {
                    document.getElementById("newTemplateBtn").classList.remove("hidden");
                }

                fetchInspections(session);

            } catch (err) {
                console.error("Initialization Error:", err);
            }
        }

        // Fungsi Global Event Delegation untuk kawalan buka/tutup menu sisi pada Mobile
        function setupSidebarToggle() {
            document.addEventListener('click', (e) => {
                const toggleBtn = e.target.closest('#mobileMenuBtn');
                const closeBtn = e.target.closest('#closeMenuBtn');
                const overlay = e.target.closest('#mobileOverlay');

                const sidebarMenu = document.getElementById('sidebarMenu');
                const mobileOverlay = document.getElementById('mobileOverlay');

                if (!sidebarMenu) return;

                // Membuka Drawer Menu Sisi
                if (toggleBtn) {
                    sidebarMenu.classList.remove('-translate-x-full');
                    if (mobileOverlay) mobileOverlay.classList.remove('hidden');
                    document.body.style.overflow = 'hidden'; 
                }

                // Menutup Drawer Menu Sisi
                if (closeBtn || overlay) {
                    sidebarMenu.classList.add('-translate-x-full');
                    if (mobileOverlay) mobileOverlay.classList.add('hidden');
                    document.body.style.overflow = ''; 
                }
            });
        }

        async function fetchInspections(session) {
            const grid = document.getElementById('inspectionGrid');
            const loader = document.getElementById('loader');

            try {
                // 1. Dapatkan senarai semua pelan induk template audit
                const qTemplates = query(collection(db, "inspection_templates"), orderBy("createdAt", "desc"));
                const snapTemplates = await getDocs(qTemplates);

                // 2. Dapatkan senarai data jawapan audit milik akaun pekerja semasa
                const qSubmissions = query(
                    collection(db, "inspection_submissions"), 
                    where("submittedBy.id", "==", session.employeeId || session.uid)
                );
                const snapSubmissions = await getDocs(qSubmissions);

                // 3. Bina pemetaan objek bagi rujukan pantas berasaskan templateId
                const submissionMap = {};
                snapSubmissions.forEach(subDoc => {
                    const subData = subDoc.data();
                    if (subData.templateId) {
                        subData.submissionId = subDoc.id; 
                        submissionMap[subData.templateId] = subData;
                    }
                });

                loader.classList.add('hidden');

                if (snapTemplates.empty) {
                    grid.innerHTML = renderEmptyState();
                    lucide.createIcons();
                    return;
                }

                let inspectionsList = [];

                snapTemplates.forEach(doc => {
                    const data = doc.data();
                    const templateId = doc.id;
                    const userSubmission = submissionMap[templateId];

                    let sortWeight = 1; 
                    let overallStatus = "Not Started";

                    if (userSubmission) {
                        const leaderApp = userSubmission.leaderApproval || {};
                        const execApp = userSubmission.executiveApproval || userSubmission.exectutiveApproval || {};

                        const isLeaderApproved = leaderApp.status === 'Approved';
                        const isExecApproved = execApp.status === 'Approved';
                        const isAnyRejected = leaderApp.status === 'Rejected' || execApp.status === 'Rejected';

                        if (isLeaderApproved && isExecApproved) {
                            overallStatus = "Approved";
                            sortWeight = 3;
                        } else if (isAnyRejected) {
                            overallStatus = "Rejected";
                            sortWeight = 3;
                        } else {
                            overallStatus = "Pending";
                            sortWeight = 2;
                        }
                    }

                    inspectionsList.push({
                        templateId,
                        data,
                        userSubmission,
                        overallStatus,
                        sortWeight,
                        createdAtMillis: data.createdAt ? data.createdAt.toMillis() : 0 
                    });
                });

                // Isih data: Utamakan tugasan baharu, diikuti tugasan pending dan tugasan selesai
                inspectionsList.sort((a, b) => {
                    if (a.sortWeight !== b.sortWeight) {
                        return a.sortWeight - b.sortWeight;
                    }
                    return b.createdAtMillis - a.createdAtMillis;
                });

                grid.innerHTML = "";
                inspectionsList.forEach(item => {
                    grid.innerHTML += renderInspectionCard(item);
                });

                lucide.createIcons();
            } catch (e) {
                console.error("Fetch Error:", e);
                grid.innerHTML = `<p class="col-span-full text-center text-red-500 font-bold p-12">Failed to load templates or tracking data.</p>`;
            }
        }

        function renderEmptyState() {
            return `
                <div class="col-span-full">
                    <div class="bg-white border border-slate-200 rounded-[28px] p-16 text-center shadow-sm">
                        <div class="flex justify-center mb-5">
                            <div class="w-12 h-12 rounded-full bg-green-100 flex items-center justify-center">
                                <i data-lucide="badge-check" class="text-green-600"></i>
                            </div>
                        </div>
                        <h2 class="text-3xl font-black text-slate-900 mb-3">You're All Caught Up!</h2>
                        <p class="text-slate-500 text-lg">There are currently no inspection templates available.</p>
                    </div>
                </div>`;
        }

        function renderInspectionCard({ templateId, data, userSubmission, overallStatus }) {
            const lhCount = data.lh?.length || 0;
            const rhCount = data.rh?.length || 0;
            const date = data.createdAt ? data.createdAt.toDate().toLocaleDateString() : 'N/A';
            const creatorName = data.createdBy?.name || data.createdByName || "Unknown";

            let statusBadgeHTML = "";
            let approvalTracksHTML = "";
            let actionButtonHTML = "";
            let rejectionReasonsHTML = "";

            if (!userSubmission) {
                // PAPARAN KAD: JIKA BELUM DIKUNCI / BELUM AMBIL AUDIT
                statusBadgeHTML = `<span class="px-2.5 py-1 rounded-xl bg-slate-100 text-slate-600 text-xs font-black border border-slate-200">Not Started</span>`;
                actionButtonHTML = `
                    <button onclick="window.location.href='TakeInspection.html?id=${templateId}'"
                        class="mt-5 w-full py-3 bg-purple-600 text-white font-black rounded-xl hover:bg-purple-700 active:scale-[0.98] transition flex items-center justify-center gap-2 shadow-sm">
                        <i data-lucide="play" size="16"></i> Start Inspection
                    </button>`;
            } else {
                // PAPARAN KAD: JIKA DATA BORANG DAH SUBMITTED
                const leaderApp = userSubmission.leaderApproval || {};
                const execApp = userSubmission.executiveApproval || userSubmission.exectutiveApproval || {};

                let badgeClass = "bg-amber-50 text-amber-700 border-amber-200"; 
                if (overallStatus === "Approved") badgeClass = "bg-green-100 text-green-800 border-green-300";
                if (overallStatus === "Rejected") badgeClass = "bg-red-100 text-red-800 border-red-300";

                statusBadgeHTML = `<span class="px-2.5 py-1 rounded-xl border ${badgeClass} text-xs font-black tracking-wide uppercase">${overallStatus}</span>`;

                const isLeaderApproved = leaderApp.status === 'Approved';
                const isExecApproved = execApp.status === 'Approved';

                approvalTracksHTML = `
                    <div class="mt-4 pt-3 border-t border-dashed border-slate-100 space-y-2">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-wider">Approval Progress</p>
                        <div class="flex items-center justify-between text-xs">
                            <span class="text-slate-500 flex items-center gap-1 font-medium">
                                <i data-lucide="shield-check" size="14" class="text-slate-400"></i> QC Leader:
                            </span>
                            <span class="font-black ${isLeaderApproved ? 'text-green-600' : (leaderApp.status === 'Rejected' ? 'text-red-600' : 'text-amber-500')}">
                                ${leaderApp.status || 'Pending'}
                            </span>
                        </div>
                        <div class="flex items-center justify-between text-xs">
                            <span class="text-slate-500 flex items-center gap-1 font-medium">
                                <i data-lucide="user-check" size="14" class="text-slate-400"></i> Executive:
                            </span>
                            <span class="font-black ${isExecApproved ? 'text-green-600' : (execApp.status === 'Rejected' ? 'text-red-600' : 'text-amber-500')}">
                                ${execApp.status || 'Pending'}
                            </span>
                        </div>
                    </div>`;

                // DIKEMASKINI: Logik Kekunci Tindakan Dinamik mengikut standard Enterprise Sistem
                if (overallStatus === "Pending") {
                    actionButtonHTML = `
                        <div class="mt-5 w-full py-3 bg-slate-50 text-slate-400 font-black rounded-xl border border-slate-200/60 text-center text-xs flex items-center justify-center gap-2 select-none">
                            <i data-lucide="lock" size="14" class="text-slate-400"></i> Locked — Under Review
                        </div>`;
                } else if (overallStatus === "Approved") {
                    actionButtonHTML = `
                        <div class="mt-5 w-full py-3 bg-green-50 text-green-700 font-black rounded-xl border border-green-200 text-center text-xs flex items-center justify-center gap-2 select-none">
                            <i data-lucide="check-circle" size="14"></i> Certified & Approved
                        </div>`;
                } else if (overallStatus === "Rejected") {
                    // Jika Rejected, tukar butang untuk membolehkan operator hantar semula (Retake/Redo)
                    actionButtonHTML = `
                        <button onclick="window.location.href='TakeInspection.html?id=${templateId}'"
                            class="mt-5 w-full py-3 bg-red-600 text-white font-black rounded-xl hover:bg-red-700 active:scale-[0.98] transition flex items-center justify-center gap-2 shadow-sm">
                            <i data-lucide="alert-triangle" size="14"></i> Retake Inspection
                        </button>`;

                    // Ambil nota ulasan/sebab kenapa audit ditolak oleh penyemak
                    let reasons = [];
                    if (leaderApp.status === 'Rejected' && leaderApp.reason) {
                        reasons.push(`<strong>Leader:</strong> "${leaderApp.reason}"`);
                    }
                    if (execApp.status === 'Rejected' && execApp.reason) {
                        reasons.push(`<strong>Executive:</strong> "${execApp.reason}"`);
                    }

                    if (reasons.length > 0) {
                        rejectionReasonsHTML = `
                            <div class="mt-3 p-3 bg-red-50/80 border border-red-100 rounded-xl text-[11px] text-red-700 space-y-1">
                                <p class="font-black uppercase tracking-wider text-[9px] text-red-500 flex items-center gap-1">
                                    <i data-lucide="message-square" size="10"></i> Rejection Feedback:
                                </p>
                                ${reasons.map(r => `<p class="leading-relaxed font-medium">${r}</p>`).join('')}
                            </div>`;
                    }
                }
            }

            return `
                <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                    <div>
                        <div class="flex items-start justify-between gap-2">
                            <h3 class="font-black text-lg leading-snug text-slate-800">
                                ${data.title || 'Untitled'}
                            </h3>
                            ${statusBadgeHTML}
                        </div>

                        <div class="flex gap-2 mt-3 text-xs font-bold">
                            <span class="px-2 py-1 rounded-lg bg-amber-50 text-amber-700">LH ${lhCount} items</span>
                            <span class="px-2 py-1 rounded-lg bg-blue-50 text-blue-700">RH ${rhCount} items</span>
                        </div>

                        <div class="mt-4 space-y-1 text-[11px] text-slate-500 font-medium">
                            <p class="flex items-center gap-1"><i data-lucide="user" size="12" class="text-slate-400"></i> Owner: ${creatorName}</p>
                            <p class="flex items-center gap-1"><i data-lucide="calendar" size="12" class="text-slate-400"></i> Created: ${date}</p>
                        </div>

                        ${approvalTracksHTML}
                        ${rejectionReasonsHTML}
                    </div>
                    
                    ${actionButtonHTML}
                </div>`;
        }

        init();
    </script>
</body>

</html>
