<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Submissions | QC Team</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom scrollbar matching the operator board design specifications */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #a78bfa;
        }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900 font-sans antialiased selection:bg-purple-200">

    <div id="pinOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[1000] flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-[28px] shadow-2xl max-w-sm w-full text-center border border-slate-100">
            <div class="w-14 h-14 bg-amber-50 rounded-full flex items-center justify-center mx-auto mb-4 border border-amber-100">
                <i data-lucide="lock" class="text-amber-600" size="28"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-800 mb-1">Access Protected</h2>
            <p class="text-xs text-slate-400 font-bold mb-5 uppercase tracking-wider">Management Authorization Required</p>
            <input type="password" id="pinInput" maxlength="4" placeholder="••••" 
                class="w-full text-center text-3xl font-black tracking-[0.5em] py-3.5 rounded-2xl border-2 border-slate-200 focus:border-amber-500 focus:ring-4 focus:ring-amber-50 outline-none mb-4 transition-all bg-slate-50">
            <button onclick="checkPin()" class="w-full py-4 bg-amber-600 text-white font-black rounded-xl hover:bg-amber-700 shadow-lg shadow-amber-600/20 active:scale-[0.98] transition-all">Unlock Access</button>
        </div>
    </div>

    <div id="rejectionModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[999] hidden flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-[24px] shadow-2xl max-w-md w-full border border-slate-100">
            <h3 class="text-xl font-black text-slate-900 mb-2 flex items-center gap-2">
                <i data-lucide="message-square-dashed" class="text-red-500"></i> Rejection Feedback
            </h3>
            <p class="text-xs font-bold text-slate-400 uppercase tracking-wide mb-3">State the reason for non-compliance / correction needed</p>
            <textarea id="rejectionReasonInput" rows="4" placeholder="Example: Incomplete inspection on LH Section Item 2. Please retake the evaluation..."
                class="w-full p-4 border-2 border-slate-200 rounded-xl font-medium text-sm outline-none focus:border-red-500 focus:ring-4 focus:ring-red-50 transition-all"></textarea>
            <div class="flex gap-3 mt-4">
                <button onclick="closeRejectionModal()" class="flex-1 py-3 bg-slate-100 text-slate-600 font-black rounded-xl text-sm hover:bg-slate-200 transition-all">Cancel</button>
                <button id="confirmRejectBtn" class="flex-1 py-3 bg-red-600 text-white font-black rounded-xl text-sm hover:bg-red-700 transition-all shadow-md shadow-red-600/10">Confirm Reject</button>
            </div>
        </div>
    </div>

    <div class="flex flex-col md:flex-row min-h-screen">
        <div id="sidebar-container" class="md:h-screen sticky top-0 z-50"></div>

        <main class="flex-1 p-4 md:p-8 overflow-y-auto">
            <header class="mb-8 border-b border-slate-100 pb-5">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div class="flex items-center justify-between w-full md:w-auto gap-4">
                        <div>
                            <h1 class="text-3xl md:text-4xl font-black flex items-center gap-3 tracking-tight">
                                <i data-lucide="file-check" id="headerIcon" class="text-purple-600"></i> Verification Board
                            </h1>
                            <p class="text-slate-500 font-bold text-sm mt-1">Review, crosscheck, and sign off multi-level QA examinations and field inspection audits.</p>
                        </div>
                    </div>
                    <div id="roleIndicator" class="text-xs font-black px-4 py-2 rounded-xl border self-start md:self-center shadow-sm uppercase tracking-wider">
                        Verifying Profile...
                    </div>
                </div>
                
                <div class="flex flex-wrap gap-2 mt-6 overflow-x-auto pb-2 custom-scrollbar">
                    <button onclick="filterSubmissions('all')" id="btn-all" class="px-5 py-2 bg-slate-900 text-white text-xs rounded-xl font-black shadow-sm transition-all whitespace-nowrap">All Submissions</button>
                    <button onclick="filterSubmissions('exam')" id="btn-exam" class="px-5 py-2 bg-white border border-slate-200 text-slate-600 text-xs font-black rounded-xl hover:bg-slate-50 transition-all whitespace-nowrap">Exams</button>
                    <button onclick="filterSubmissions('inspection')" id="btn-inspection" class="px-5 py-2 bg-white border border-slate-200 text-slate-600 text-xs font-black rounded-xl hover:bg-slate-50 transition-all whitespace-nowrap">Inspections</button>
                </div>
            </header>
            
            <div id="submissionGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </main>
    </div>

    <script type="module">
        import { db } from './js/FirebaseConfig.js';
        import { collection, onSnapshot, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        import { loadSidebar } from './js/sidebar-loader.js';
        import { RoleManager, ROLES } from './js/Roles.js';

        // Secure active user authorization layer
        RoleManager.enforceStrictSession();
        RoleManager.protectPage(ROLES.QC_LEADER, ROLES.EXECUTIVE);

        const session = JSON.parse(localStorage.getItem("session"));
        const isLeader = session?.role === ROLES.QC_LEADER;

        const userIdentifiers = [
            String(session?.id || '').trim().toLowerCase(),
            String(session?.uid || '').trim().toLowerCase(),
            String(session?.employeeId || '').trim().toLowerCase()
        ].filter(Boolean);

        const roleIndicator = document.getElementById('roleIndicator');
        const headerIcon = document.getElementById('headerIcon');
        
        if (isLeader) {
            roleIndicator.className += " bg-purple-50 text-purple-700 border-purple-200";
            roleIndicator.innerText = "Active Role: QC Leader Queue";
            headerIcon.className = "text-purple-600";
        } else {
            roleIndicator.className += " bg-amber-50 text-amber-700 border-amber-200";
            roleIndicator.innerText = "Active Role: Executive Queue";
            headerIcon.className = "text-amber-600";
        }

        let submissionsMap = { exam: [], inspection: [] };
        let currentFilterType = 'all';
        let activeRejectionTarget = null;

        function setupMobileMenuEvents() {
            const container = document.getElementById('sidebar-container');
            const toggleBtn = document.getElementById("mobileSidebarToggle") || container.querySelector("#mobileSidebarToggle") || container.querySelector("button");
            const sidebar = container.querySelector("#mainSidebar") || document.getElementById('sidebarMenu');
            const backdrop = container.querySelector("#sidebarBackdrop") || document.getElementById('mobileOverlay');
            
            if (!toggleBtn || !sidebar || !backdrop) return;

            function toggleSidebar() {
                const isOpen = !sidebar.classList.contains("-translate-x-full");
                if (isOpen) {
                    sidebar.classList.add("-translate-x-full");
                    backdrop.classList.add("hidden");
                    backdrop.classList.remove("opacity-100");
                    toggleBtn.innerHTML = '<i data-lucide="menu" class="w-6 h-6"></i>';
                } else {
                    sidebar.classList.remove("-translate-x-full");
                    backdrop.classList.remove("hidden");
                    setTimeout(() => backdrop.classList.add("opacity-100"), 10);
                    toggleBtn.innerHTML = '<i data-lucide="x" class="w-6 h-6"></i>';
                }
                if (window.lucide) lucide.createIcons();
            }

            toggleBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                toggleSidebar();
            });
            
            backdrop.addEventListener("click", toggleSidebar);

            const closeMenuBtn = container.querySelector("#closeMenuBtn") || document.getElementById('closeMenuBtn');
            if (closeMenuBtn) {
                closeMenuBtn.addEventListener('click', toggleSidebar);
            }
        }

        window.checkPin = () => {
            if (document.getElementById('pinInput').value === "9999") { 
                sessionStorage.setItem('access_granted', 'true');
                document.getElementById('pinOverlay').classList.add('hidden');
            } else { 
                alert("Incorrect Pin. Authorization Denied."); 
                document.getElementById('pinInput').value = ""; 
            }
        };

        window.closeRejectionModal = () => {
            document.getElementById('rejectionModal').classList.add('hidden');
            document.getElementById('rejectionReasonInput').value = "";
            activeRejectionTarget = null;
        };

        window.processApproval = async (subId, newStatus, isInspection) => {
            if (newStatus === 'Rejected') {
                document.getElementById('rejectionModal').classList.remove('hidden');
                activeRejectionTarget = { subId, isInspection };
                return;
            }
            await executeStatusUpdate(subId, 'Approved', "", isInspection);
        };

        window.showBadgeInfo = (operatorName) => {
            alert(`This badge ranks the live certification compliance status for operator ${operatorName || 'Personnel'} calculated from historical audit limits.`);
        };

        document.getElementById('confirmRejectBtn').addEventListener('click', async () => {
            const reason = document.getElementById('rejectionReasonInput').value.trim();
            if (!reason) return alert("Please provide a rejection reason/feedback description!");
            
            if (activeRejectionTarget) {
                await executeStatusUpdate(activeRejectionTarget.subId, 'Rejected', reason, activeRejectionTarget.isInspection);
                closeRejectionModal();
            }
        });

        async function executeStatusUpdate(subId, targetStatus, reason = "", isInspection) {
            try {
                const colName = isInspection ? "qc_inspection_submissions" : "qc_exam_submissions";
                const updatePayload = { updatedAt: serverTimestamp() };

                if (isLeader) {
                    updatePayload.leaderApproval = {
                        status: targetStatus,
                        approverName: session.name || "QC Leader",
                        reason: reason,
                        processedAt: new Date()
                    };
                    updatePayload.status = (targetStatus === 'Approved') ? "pending_exec" : "Rejected";
                } else {
                    updatePayload.executiveApproval = {
                        status: targetStatus,
                        approverName: session.name || "Executive",
                        reason: reason,
                        processedAt: new Date()
                    };
                    updatePayload.status = (targetStatus === 'Approved') ? "Approved" : "Rejected";
                }

                await updateDoc(doc(db, colName, subId), updatePayload);
                alert(`Submission record successfully flagged as [${targetStatus}]`);
            } catch (error) {
                console.error("Database Update Failure:", error);
                alert("Failed to commit approval state: " + error.message);
            }
        }

        window.filterSubmissions = (type) => {
            currentFilterType = type;
            
            ['all', 'exam', 'inspection'].forEach(t => {
                const btn = document.getElementById(`btn-${t}`);
                if (t === type) {
                    btn.className = "px-5 py-2 bg-slate-900 text-white text-xs rounded-xl font-black shadow-sm transition-all whitespace-nowrap";
                } else {
                    btn.className = "px-5 py-2 bg-white border border-slate-200 text-slate-600 text-xs font-black rounded-xl hover:bg-slate-50 transition-all whitespace-nowrap";
                }
            });

            const grid = document.getElementById('submissionGrid');
            grid.innerHTML = '';
            
            const allSubmissions = [...submissionsMap.exam, ...submissionsMap.inspection];
            const filtered = type === 'all' ? allSubmissions : allSubmissions.filter(s => s.type === type);
            
            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-20 text-center text-slate-400">
                        <i data-lucide="inbox" size="56" class="mb-3 opacity-40 text-slate-300"></i>
                        <h3 class="text-lg font-black text-slate-600">No Review Tasks Available</h3>
                        <p class="text-xs text-slate-400 font-medium max-w-xs">You are currently fully cleared! No pending operations require your digital signature right now.</p>
                    </div>`;
                lucide.createIcons();
            } else {
                filtered.forEach(s => renderCard(s));
            }
        };

        function renderCard(s) {
            const grid = document.getElementById('submissionGrid');
            
            let statusColor = "bg-amber-50 text-amber-700 border-amber-200";
            if (s.status === 'Approved') statusColor = "bg-green-100 text-green-800 border-green-300";
            if (s.status === 'Rejected') statusColor = "bg-red-100 text-red-800 border-red-300";

            // Extract Date and Time separately
            let dateStr = 'Pending...';
            let timeStr = '--:--';
            const timestampObj = s.submittedAt || s.createdAt || s.updatedAt;
            
            if (timestampObj && typeof timestampObj.toDate === 'function') {
                const d = timestampObj.toDate();
                dateStr = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
                timeStr = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
            }

            const leaderApp = s.leaderApproval || {};
            const execApp = s.executiveApproval || s.exectutiveApproval || {};

            const leaderState = leaderApp.status || "Pending";
            const execState = execApp.status || "Pending";
            
            const leaderName = leaderApp.approverName || s.leaderName || "";
            const execName = execApp.approverName || s.executiveName || "";

            const leaderBadgeColor = leaderState === 'Approved' ? 'bg-green-50 text-green-600 border border-green-200' : (leaderState === 'Rejected' ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-amber-50 text-amber-600 border border-amber-200');
            const execBadgeColor = execState === 'Approved' ? 'bg-green-50 text-green-600 border border-green-200' : (execState === 'Rejected' ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-amber-50 text-amber-600 border border-amber-200');

            grid.innerHTML += `
                <div class="bg-white p-5 rounded-[24px] border border-slate-200/80 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 flex flex-col justify-between group">
                    <div>
                        <!-- Header -->
                        <div class="flex justify-between items-start gap-3 mb-4">
                            <h3 class="font-black text-lg text-slate-800 leading-tight group-hover:text-purple-700 transition-colors line-clamp-2" title="${s.title}">${s.title}</h3>
                            <span class="text-[10px] px-2.5 py-1 rounded-lg font-black uppercase tracking-wider border ${statusColor} shrink-0 shadow-sm">${s.status.replace('_', ' ')}</span>
                        </div>
                        
                        <!-- Details Box -->
                        <div class="bg-slate-50 p-4 rounded-[18px] text-xs space-y-2.5 font-medium border border-slate-100 relative shadow-inner">
                            <p class="flex justify-between items-center text-slate-500 pr-2">
                                <span class="font-bold flex items-center gap-1.5"><i data-lucide="user" size="14" class="text-slate-400"></i> Name:</span> 
                                <span class="text-slate-800 font-black">${s.operatorName || "Anonymous"}</span>
                            </p>
                            <p class="flex justify-between items-center text-slate-500">
                                <span class="font-bold flex items-center gap-1.5"><i data-lucide="hash" size="14" class="text-slate-400"></i> ID:</span> 
                                <span class="text-slate-700 font-bold">#${s.operatorId || "N/A"}</span>
                            </p>
                            
                            <div class="h-px bg-slate-200/60 my-1"></div>

                            <p class="flex justify-between items-center text-slate-500">
                                <span class="font-bold flex items-center gap-1.5"><i data-lucide="calendar" size="14" class="text-slate-400"></i> Date Submission:</span> 
                                <span class="text-slate-700 font-semibold">${dateStr}</span>
                            </p>
                            <p class="flex justify-between items-center text-slate-500">
                                <span class="font-bold flex items-center gap-1.5"><i data-lucide="clock" size="14" class="text-slate-400"></i> Time:</span> 
                                <span class="text-slate-700 font-semibold">${timeStr}</span>
                            </p>
                            
                            <div class="h-px bg-slate-200/60 my-1"></div>

                            <p class="flex justify-between items-center text-slate-500">
                                <span class="font-bold flex items-center gap-1.5"><i data-lucide="layers" size="14" class="text-slate-400"></i> Domain:</span> 
                                <span class="uppercase font-black text-[10px] bg-purple-100 text-purple-700 px-2 py-0.5 rounded-md border border-purple-200 shadow-sm">${s.type}</span>
                            </p>
                        </div>

                        <!-- Logs Box -->
                        <div class="mt-5 space-y-2.5">
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-1.5 border-b border-dashed border-slate-200 pb-2">
                                <i data-lucide="clipboard-signature" size="14"></i> Approval Signature Logs
                            </p>
                            
                            <div class="grid grid-cols-2 gap-2">
                                <!-- Leader Log Box -->
                                <div class="flex flex-col gap-1.5 p-3 rounded-xl bg-white border border-slate-100 shadow-sm hover:border-purple-200 transition-colors">
                                    <div class="flex flex-col gap-1.5">
                                        <span class="text-[11px] text-slate-500 font-bold flex items-center gap-1.5">
                                            <i data-lucide="shield-check" size="12" class="text-purple-500"></i> QC Leader
                                        </span>
                                        <span class="font-black px-2 py-1 rounded-lg text-[9px] uppercase tracking-wider text-center ${leaderBadgeColor}">
                                            ${leaderState}
                                        </span>
                                    </div>
                                    ${leaderName ? `<p class="text-[10px] text-slate-400 font-semibold truncate mt-1" title="${leaderName}">By: ${leaderName}</p>` : ''}
                                </div>

                                <!-- Exec Log Box -->
                                <div class="flex flex-col gap-1.5 p-3 rounded-xl bg-white border border-slate-100 shadow-sm hover:border-amber-200 transition-colors">
                                    <div class="flex flex-col gap-1.5">
                                        <span class="text-[11px] text-slate-500 font-bold flex items-center gap-1.5">
                                            <i data-lucide="user-check" size="12" class="text-amber-500"></i> Executive
                                        </span>
                                        <span class="font-black px-2 py-1 rounded-lg text-[9px] uppercase tracking-wider text-center ${execBadgeColor}">
                                            ${execState}
                                        </span>
                                    </div>
                                    ${execName ? `<p class="text-[10px] text-slate-400 font-semibold truncate mt-1" title="${execName}">By: ${execName}</p>` : ''}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-2.5 mt-6 pt-5 border-t border-slate-100">
                        <button onclick="processApproval('${s.id}', 'Approved', ${s.type === 'inspection'})" 
                            class="flex-1 py-3.5 bg-green-600 text-white rounded-xl text-xs font-black hover:bg-green-700 transition-all shadow-md shadow-green-600/20 active:scale-[0.98] flex items-center justify-center gap-1.5">
                            <i data-lucide="check-circle" size="16"></i> Sign Off
                        </button>
                        <button onclick="processApproval('${s.id}', 'Rejected', ${s.type === 'inspection'})" 
                            class="flex-1 py-3.5 bg-red-50 text-red-600 border border-red-200 rounded-xl text-xs font-black hover:bg-red-100 transition-all active:scale-[0.98] flex items-center justify-center gap-1.5 shadow-sm">
                            <i data-lucide="x-circle" size="16"></i> Reject
                        </button>
                    </div>
                </div>`;
            lucide.createIcons();
        }

        function isAssignedToMe(savedReviewerId) {
            if (!savedReviewerId) return false;
            const target = String(savedReviewerId).trim().toLowerCase();
            return userIdentifiers.includes(target);
        }

        onSnapshot(collection(db, "qc_exam_submissions"), (snap) => {
            submissionsMap.exam = [];
            snap.forEach(d => {
                const data = d.data();
                const relevantReviewerId = isLeader ? data.leaderId : data.executiveId;
                
                if (isAssignedToMe(relevantReviewerId)) {
                    submissionsMap.exam.push({ 
                        id: d.id, 
                        ...data, 
                        type: 'exam', 
                        title: data.examTitle || data.examName || 'QC Exam' 
                    });
                }
            });
            filterSubmissions(currentFilterType);
        });

        onSnapshot(collection(db, "qc_inspection_submissions"), (snap) => {
            submissionsMap.inspection = [];
            snap.forEach(d => {
                const data = d.data();
                const relevantReviewerId = isLeader ? data.leaderId : (data.executiveId || data.exectutiveId);
                
                if (isAssignedToMe(relevantReviewerId)) {
                    submissionsMap.inspection.push({ 
                        id: d.id, 
                        ...data, 
                        type: 'inspection', 
                        title: data.templateTitle || 'Field Audit' 
                    });
                }
            });
            filterSubmissions(currentFilterType);
        });

        async function initApp() {
            try {
                await loadSidebar(isLeader ? "SidebarLeader.html" : "SidebarExecutive.html");
                setupMobileMenuEvents(); 
            } catch (e) {
                console.warn("Sidebar interface build bypassed:", e);
            }

            if (sessionStorage.getItem('access_granted') === 'true') {
                document.getElementById('pinOverlay').classList.add('hidden');
            } else {
                document.getElementById('pinOverlay').classList.remove('hidden');
            }

            if (window.lucide) lucide.createIcons();
        }

        initApp();
    </script>
</body>
</html>
