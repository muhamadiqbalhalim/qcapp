<script>
    // Automatik menyerlahkan pautan navigasi aktif berasaskan fail halaman semasa
    (function highlightNavbar() {
        const currentPath = window.location.pathname.split("/").pop();
        const navLinks = document.querySelectorAll('.nav-link');
        
        navLinks.forEach(link => {
            const targetPath = link.getAttribute('data-path');
            if (currentPath === targetPath) {
                link.classList.remove('text-slate-600', 'hover:bg-purple-50', 'hover:text-purple-600');
                link.classList.add('bg-purple-600', 'text-white', 'shadow-md', 'shadow-purple-100');
            }
        });
    })();
</script>
